<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Flächenvergleich — Die Hauswand — 6 Amot</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 19 · Flächenvergleich</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">כֹּתֶל הַבַּיִת — 6 אַמּוֹת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die Hauswand — 6 Amot</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Relative Proportion · Einheiten nur, wo die Quelle sie nennt</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="70.0" y="168.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Ausdrücklich genannte Einheiten dieser Karte</text><text x="70.0" y="190.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Hauswand: 6 Amot</text><text x="410.0" y="190.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Messrute: 6 lange Amot</text><text x="70.0" y="252.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13">Maße in Ammot</text><text x="70.0" y="272.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">im Text ausdrücklich genannt</text><rect x="70.0" y="300.0" width="420.0" height="420.0" fill="#101515" stroke="#D7BD87" stroke-width="2"/><text x="80.0" y="515.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12">Torzelle</text><text x="480.0" y="515.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">6 × 6 Ammot</text><line x1="70.0" y1="744.0" x2="1080.0" y2="744.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><text x="70.0" y="766.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">Jechezkel 40:7, 12</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Ammot — Einheit im Text genannt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">errechnet — aus einer Angabe der Karte abgeleitet</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#6E9EAA" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">ohne Einheit — Zahl belegt, Einheit nicht genannt</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhe der Hauswand</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Umrechnung zwischen den Ebenen</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· absolute Größe in Metern</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Flächenvergleich · relative Proportion · keine Gleichsetzung der Einheiten</text></svg>