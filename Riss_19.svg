D87" font-family="EB Garamond, Georgia, serif" font-size="12">HEICHAL-EINGANG · ZWEI GETRENNTE PFEILERBREITEN</text><rect x="150.0" y="685.0" width="108.0" height="55.0" fill="#B8925D" stroke="#D7BD87" stroke-width="1"/><rect x="450.0" y="685.0" width="108.0" height="55.0" fill="#B8925D" stroke="#D7BD87" stroke-width="1"/><line x1="150.0" y1="765.0" x2="258.0" y2="765.0" stroke="#D7BD87" stroke-width="1"/><line x1="150.0" y1="761.0" x2="150.0" y2="769.0" stroke="#D7BD87" stroke-width="1"/><line x1="258.0" y1="761.0" x2="258.0" y2="769.0" stroke="#D7BD87" stroke-width="1"/><text x="204.0" y="758.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">6 Amot je Seite</text><line x1="450.0" y1="765.0" x2="558.0" y2="765.0" stroke="#D7BD87" stroke-width="1"/><line x1="450.0" y1="761.0" x2="450.0" y2="769.0" stroke="#D7BD87" stroke-width="1"/><line x1="558.0" y1="761.0" x2="558.0" y2="769.0" stroke="#D7BD87" stroke-width="1"/><text x="504.0" y="758.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">6 Amot je Seite</text><text x="354.0" y="718.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Eingangsöffnung · Maß auf dieser Karte offen</text><text x="760.0" y="690.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12">Nicht gleichsetzen:</text><text x="760.0" y="716.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Wandstärke · Mauerquerschnitt · Raumgrundfläche · Pfeilerbreite</text><text x="760.0" y="740.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11">Die gemeinsame Zahl erzeugt keinen gemeinsamen Baukörper.</text><line x1="46.0" y1="796.0" x2="1194.0" y2="796.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="804.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="812.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">durchgezogen — beide Achsen belegt</text><rect x="46.0" y="822.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="830.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">blau — Grundfläche oder Fundament</text><rect x="46.0" y="840.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="848.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">schraffiert — Höhe oder Ausdehnung offen</text><text x="645.0" y="810.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="828.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhe der Hauswand</text><text x="645.0" y="844.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhe des Kammerfundaments</text><text x="645.0" y="860.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhe der Torzelle</text><text x="645.0" y="876.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gleichsetzung der vier Bauteile</text><text x="620.0" y="908.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Maßregister · gleiche Zahl, verschiedene Achsen · keine Verschmelzung</text></svg>