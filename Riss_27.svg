<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1120" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Schiloach-Becken · Befundregister — Das Schiloach-Becken — Grabungsbefund</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1120.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 27 · Schiloach-Becken · Befundregister</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">בְּרֵכַת הַשִּׁלֹחַ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Das Schiloach-Becken — Grabungsbefund</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Meter innerhalb des jeweiligen Befundstands · keine Mittelung</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><rect x="70.0" y="165.0" width="520.0" height="360.0" fill="#101515" stroke="#B8925D" stroke-width="1.5" rx="8"/><text x="88.0" y="193.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">PNAS 2025 · Fachpublikation</text><text x="88.0" y="214.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">ein zusammengehöriger Maßsatz · nicht mit IAA-Werten mitteln</text><rect x="135.0" y="265.0" width="342.0" height="180.0" fill="url(#rHatchQ)" stroke="#9EC2C7" stroke-width="2"/><line x1="135.0" y1="241.0" x2="477.0" y2="241.0" stroke="#9EC2C7" stroke-width="1"/><line x1="135.0" y1="237.0" x2="135.0" y2="245.0" stroke="#9EC2C7" stroke-width="1"/><line x1="477.0" y1="237.0" x2="477.0" y2="245.0" stroke="#9EC2C7" stroke-width="1"/><text x="306.0" y="234.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">mind. 19 m lang</text><line x1="111.0" y1="265.0" x2="111.0" y2="445.0" stroke="#9EC2C7" stroke-width="1"/><line x1="107.0" y1="265.0" x2="115.0" y2="265.0" stroke="#9EC2C7" stroke-width="1"/><line x1="107.0" y1="445.0" x2="115.0" y2="445.0" stroke="#9EC2C7" stroke-width="1"/><text x="103.0" y="355.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle" transform="rotate(-90 103.0 355.0)">10 m breit</text><line x1="505.0" y1="285.0" x2="505.0" y2="428.0" stroke="#D7BD87" stroke-width="5"/><line x1="535.0" y1="285.0" x2="535.0" y2="428.0" stroke="#D7BD87" stroke-width="1"/><line x1="531.0" y1="285.0" x2="539.0" y2="285.0" stroke="#D7BD87" stroke-width="1"/><line x1="531.0" y1="428.0" x2="539.0" y2="428.0" stroke="#D7BD87" stroke-width="1"/><text x="527.0" y="356.5" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle" transform="rotate(-90 527.0 356.5)">11 m hoch</text><text x="135.0" y="485.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10">Grundfläche und Höhe gehören zu diesem Publikationssatz.</text><rect x="650.0" y="165.0" width="520.0" height="360.0" fill="#101515" stroke="#B8925D" stroke-width="1.5" rx="8"/><text x="668.0" y="193.0" 