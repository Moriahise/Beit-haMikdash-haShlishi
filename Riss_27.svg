mond, Georgia, serif" font-size="11">Bericht 2026</text><text x="115.0" y="638.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13">3 Abschnitte × je 5 Stufen</text><line x1="100.0" y1="728.0" x2="560.0" y2="728.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="3 5"/><text x="115.0" y="758.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Fahrplanstand ab 2004</text><text x="115.0" y="785.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12">mehrere Läufe zu 4–5 · Anzahl der Läufe offen</text><rect x="650.0" y="560.0" width="520.0" height="275.0" fill="#101515" stroke="#B8925D" stroke-width="1.5" rx="8"/><text x="668.0" y="588.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Ostseite und Fläche</text><text x="668.0" y="609.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">Teilbefund und Schätzung ergeben keinen fertigen Beckenplan</text><line x1="715.0" y1="665.0" x2="925.0" y2="665.0" stroke="#9EC2C7" stroke-width="6"/><line x1="925.0" y1="665.0" x2="1065.0" y2="665.0" stroke="#C96B62" stroke-width="3" stroke-dasharray="7 6"/><line x1="715.0" y1="640.0" x2="925.0" y2="640.0" stroke="#9EC2C7" stroke-width="1"/><line x1="715.0" y1="636.0" x2="715.0" y2="644.0" stroke="#9EC2C7" stroke-width="1"/><line x1="925.0" y1="636.0" x2="925.0" y2="644.0" stroke="#9EC2C7" stroke-width="1"/><text x="820.0" y="633.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">ca. 30 m freigelegt</text><text x="1065.0" y="672.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="end">≈ 50 m nur historische Näherung</text><rect x="715.0" y="735.0" width="390.0" height="48.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1.2"/><text x="910.0" y="765.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Fläche: Größenordnung ½ ha · Umriss offen</text><rect x="70.0" y="870.0" width="1100.0" height="68.0" fill="#0B0E0E" stroke="#C96B62" stroke-width="1.5" stroke-dasharray="6 5"/><text x="620.0" y="899.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Bodenlage und maximale Tiefe: nicht angegeben · Grabung nicht abgeschlossen</text><text x="620.0" y="922.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Das Becken des Schelach in Nechemja 3:15 wird nicht mit diesem Befund gleichgesetzt.</text><line x1="46.0" y1="986.0" x2="1194.0" y2="986.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="994.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="1002.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">belegt — Maß innerhalb einer Quelle</text><rect x="46.0" y="1012.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="1020.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — Mindestmaß, Fortsetzung oder Schätzung</text><rect x="46.0" y="1030.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="1038.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">getrennte Felder — Publikationsstände nicht verschmolzen</text><text x="645.0" y="1000.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="1018.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· geschlossener Beckenumriss</text><text x="645.0" y="1034.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Bodenlage und maximale Tiefe</text><text x="645.0" y="1050.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gesamtzahl aller Stufen</text><text x="645.0" y="1066.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gleichsetzung mit Nechemja 3:15</text><text x="620.0" y="1098.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Archäologisches Befundregister · abschnitts- und publikationsgebunden · nicht normativ</text></svg>