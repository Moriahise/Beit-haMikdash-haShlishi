<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — 500 × 500 Amot — der halachische Referenzberg</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 05 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">חֲמֵשׁ מֵאוֹת עַל חֲמֵשׁ מֵאוֹת אַמָּה</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">500 × 500 Amot — der halachische Referenzberg</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Maßstab in Ammot außen · innere Größe symbolisch · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><line x1="544.9" y1="258.9" x2="170.0" y2="546.7" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="649.9" y1="300.0" x2="275.0" y2="587.8" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="754.9" y1="341.1" x2="380.0" y2="628.9" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="860.0" y1="382.2" x2="485.1" y2="670.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="965.0" y1="423.3" x2="590.1" y2="711.1" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="1070.0" y1="464.4" x2="695.1" y2="752.2" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="544.9" y1="258.9" x2="1070.0" y2="464.4" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="469.9" y1="316.5" x2="995.0" y2="521.9" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="394.9" y1="374.0" x2="920.0" y2="579.5" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="320.0" y1="431.6" x2="845.1" y2="637.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="245.0" y1="489.1" x2="770.1" y2="694.6" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="170.0" y1="546.7" x2="695.1" y2="752.2" stroke="#B8925D" stroke-width=".5" opacity=".22"/><polygon points="531.4,304.7 846.5,428.0 674.0,560.4 359.0,437.1" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="846.5,429.1 674.0,561.4 674.0,560.4 846.5,428.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="674.0,561.4 359.0,438.2 359.0,437.1 674.0,560.4" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="544.9,258.9 1070.0,464.4 695.1,752.2 170.0,546.7" fill="#101515" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="1070.0,465.5 695.1,753.2 695.1,752.2 1070.0,464.4" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="695.1,753.2 170.0,547.8 170.0,546.7 695.1,752.2" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><text x="620.0" y="504.5" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Har HaBajit · 500 × 500 Ammot</text><text x="602.7" y="431.5" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Asarah · Größe offen · Lage nur nach Rang</text><text x="867.4" y="315.6" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">NORD</text><text x="945.6" y="632.9" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">OST</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Außenquadrat 500 × 500 Ammot maßstäblich; die Asarah-Platte besitzt keine ablesbare Größe.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Ihre Lage zeigt nur Süd &gt; Ost &gt; Nord &gt; West: Süden am weitesten, Westen am nächsten.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Unterbau und doppelter Portikus sind belegt, aber mangels Maßen nicht aufgestellt.</text><line x1="46" y1="756" x2="158.77484232377168" y2="756" stroke="#D7BD87" stroke-width="3"/><text x="168.8" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">100 Ammot außen · innere Größe symbolisch (in der Bodenebene)</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Außenplatte — 500 × 500 Ammot</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offene Innenplatte — nur Ranglage</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Raster — 100-Ammot-Außenbezug</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Asarah-Größe</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· numerische Randabstände</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerhöhe und -stärke</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Unterbau- und Portikusmaße</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Referenzberg · Außenmaß maßstäblich · Innenlage nur relational</text></svg>