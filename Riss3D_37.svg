<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Die unverzichtbaren Baukörper</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 37 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">עִקְּרֵי הַבִּנְיָן</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die unverzichtbaren Baukörper</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Baukörperordnung · Maße nicht angegeben · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polygon points="399.9,384.6 495.4,421.9 436.3,467.3 340.8,429.9" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="495.4,448.1 436.3,493.5 436.3,467.3 495.4,421.9" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="436.3,493.5 340.8,456.1 340.8,429.9 436.3,467.3" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="468.1,358.4 990.1,562.6 771.9,730.1 249.9,525.9" fill="#101515" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="590.9,433.1 730.9,487.9 649.1,550.7 509.1,495.9" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="572.7,384.0 776.4,463.7 667.3,547.5 463.6,467.8" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="730.9,540.3 649.1,603.1 649.1,550.7 730.9,487.9" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="649.1,603.1 509.1,548.3 509.1,495.9 649.1,550.7" fill="#B8925D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="776.4,542.2 667.3,626.0 667.3,547.5 776.4,463.7" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="667.3,626.0 463.6,546.3 463.6,467.8 667.3,547.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="771.9,733.4 249.9,529.1 249.9,525.9 771.9,730.1" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="826.4,551.4 921.9,588.8 862.8,634.2 767.3,596.8" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="921.9,615.0 862.8,660.3 862.8,634.2 921.9,588.8" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="990.1,565.9 771.9,733.4 771.9,730.1 990.1,562.6" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="862.8,660.3 767.3,623.0 767.3,596.8 862.8,634.2" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><text x="620.0" y="537.7" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Asarah · Größe offen</text><text x="620.0" y="459.2" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Mikdasch-Kern · Maße offen</text><text x="620.0" y="485.4" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Ulam · Heichal · Debir</text><text x="418.1" y="419.4" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Lischkot</text><text x="844.6" y="586.3" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Lischkot</text><text x="794.0" y="410.7" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">NORD</text><text x="983.1" y="686.3" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">OST</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Die Körper zeigen nur die unverzichtbare Gliederung, nicht ihre Abmessungen.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Ulam, Heichal und Debir bleiben als benannte Kernfolge zusammen.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Zahl, Größe und genaue Lage der Lischkot bleiben offen.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — Baukörperordnung · Maße nicht angegeben</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Kantenlängen und Höhen</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Lischkot-Anzahl und -lage</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauer- und Torabmessungen</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Ausführungsplan</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Ikrei HaBinjan · notwendige Baukörper, bewusst unbemaßt</text></svg>