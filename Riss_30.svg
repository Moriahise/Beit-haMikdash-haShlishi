hor="middle">1000 Ammah</text><line x1="840.0" y1="346.0" x2="840.0" y2="545.0" stroke="#9EC2C7" stroke-width="1.5" stroke-dasharray="4 5"/><text x="840.0" y="332.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">3</text><line x1="840.0" y1="370.0" x2="1080.0" y2="370.0" stroke="#F2EAD9" stroke-width="1"/><line x1="840.0" y1="366.0" x2="840.0" y2="374.0" stroke="#F2EAD9" stroke-width="1"/><line x1="1080.0" y1="366.0" x2="1080.0" y2="374.0" stroke="#F2EAD9" stroke-width="1"/><text x="960.0" y="363.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">1000 Ammah</text><line x1="1080.0" y1="346.0" x2="1080.0" y2="545.0" stroke="#9EC2C7" stroke-width="1.5" stroke-dasharray="4 5"/><text x="1080.0" y="332.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">4</text><rect x="255.0" y="462.0" width="210.0" height="78.0" fill="#101515" stroke="#6E9EAA" stroke-width="1.5" rx="7"/><text x="360.0" y="492.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">מֵי אָפְסָיִם</text><text x="360.0" y="520.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Knöchel · qualitativ</text><rect x="495.0" y="462.0" width="210.0" height="78.0" fill="#101515" stroke="#6E9EAA" stroke-width="1.5" rx="7"/><text x="600.0" y="492.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">מַיִם בִּרְכָּיִם</text><text x="600.0" y="520.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Knie · qualitativ</text><rect x="735.0" y="462.0" width="210.0" height="78.0" fill="#101515" stroke="#6E9EAA" stroke-width="1.5" rx="7"/><text x="840.0" y="492.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">מֵי מָתְנָיִם</text><text x="840.0" y="520.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Lenden · qualitativ</text><rect x="975.0" y="462.0" width="210.0" height="96.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1.5" rx="7"/><text x="1080.0" y="492.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="14" text-anchor="middle">נַחַל אֲשֶׁר לֹא יֵעָבֵר</text><text x="1080.0" y="520.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">nicht durchquerbar · kein Tiefenmaß</text><line x1="120.0" y1="635.0" x2="1080.0" y2="635.0" stroke="#CFB36D" stroke-width="1"/><line x1="120.0" y1="631.0" x2="120.0" y2="639.0" stroke="#CFB36D" stroke-width="1"/><line x1="1080.0" y1="631.0" x2="1080.0" y2="639.0" stroke="#CFB36D" stroke-width="1"/><text x="600.0" y="628.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Σ 4000 Amot · rekonstruiert aus vier aufeinanderfolgenden Segmenten</text><text x="620.0" y="682.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Die vierte Station besitzt keinen vierten Körperpunkt und keine numerische Tiefe.</text><rect x="120.0" y="760.0" width="960.0" height="76.0" fill="#0B0E0E" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 5"/><text x="600.0" y="792.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Breite · Gefälle · Wassermenge · Geschwindigkeit: nicht angegeben</text><text x="600.0" y="818.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Die Körpermarken sind Stationsnamen, keine in Ammot umgerechneten Tiefen.</text><line x1="46.0" y1="876.0" x2="1194.0" y2="876.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="884.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="892.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Längsachse — vier gleiche Messstrecken</text><rect x="46.0" y="902.0" width="16.0" height="9.0" fill="#6E9EAA" opacity=".85"/><text x="70.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Station — Knöchel · Knie · Lenden</text><rect x="46.0" y="920.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="928.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offen — vierte Tiefe und Hydraulik nicht beziffert</text><text x="645.0" y="890.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="908.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· numerische Wassertiefen</text><text x="645.0" y="924.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Breite und Gefälle</text><text x="645.0" y="940.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Wassermenge und Geschwindigkeit</text><text x="645.0" y="956.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· moderne Längenumrechnung</text><text x="620.0" y="988.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Jechezkel 47:3–5 · Längen maßstäblich zueinander · Tiefen nicht numerisiert</text></svg>