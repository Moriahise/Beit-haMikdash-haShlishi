 135 Ammot</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offene Torflächen — Seite und Maß belegt, Position offen</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#F2EAD9" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Osttor — mittig belegt</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Positionen der sechs Nord-/Südtore</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Wandstärken</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Baukörperhöhen</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Innenwände aus Maßketten</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">HaAzarah · Grundfläche maßstäblich · Seitenpositionen der Tore offen</text></svg>