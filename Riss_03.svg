<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Maßstabsleiter — Ammah, Tefach und das Messrohr Jechezkels</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="820.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 03 · Maßstabsleiter</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25" direction="rtl">אַמָּה, טֶפַח וּקְנֵה הַמִּדָּה</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Ammah, Tefach und das Messrohr Jechezkels</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Verhältnisdarstellung · keine absolute Länge</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="120.0" y="184.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="12" font-style="italic">Verhältnisse, nicht Längen — die Karte nennt ausdrücklich keine cm-Umrechnung</text><rect x="120.0" y="230.0" width="900.0" height="34.0" fill="#101515" stroke="#D7BD87" stroke-width="2"/><line x1="270.0" y1="230.0" x2="270.0" y2="264.0" stroke="#B8925D" stroke-width="1"/><line x1="420.0" y1="230.0" x2="420.0" y2="264.0" stroke="#B8925D" stroke-width="1"/><line x1="570.0" y1="230.0" x2="570.0" y2="264.0" stroke="#B8925D" stroke-width="1"/><line x1="720.0" y1="230.0" x2="720.0" y2="264.0" stroke="#B8925D" stroke-width="1"/><line x1="870.0" y1="230.0" x2="870.0" y2="264.0" stroke="#B8925D" stroke-width="1"/><text x="195.0" y="252.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Ammah</text><text x="345.0" y="252.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Ammah</text><text x="495.0" y="252.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Ammah</text><text x="645.0" y="252.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Ammah</text><text x="795.0" y="252.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Ammah</text><text x="945.0" y="252.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Ammah</text><line x1="120.0" y1="216.0" x2="1020.0" y2="216.0" stroke="#F2EAD9" stroke-width="1"/><line x1="120.0" y1="212.0" x2="120.0" y2="220.0" stroke="#F2EAD9" stroke-width="1"/><line x1="1020.0" y1="212.0" x2="1020.0" y2="220.0" stroke="#F2EAD9" stroke-width="1"/><text x="570.0" y="209.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">1 Kaneh = 6 Ammot · Jechezkel 40:5</text><text x="120.0" y="324.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Vision-Ammah · sechs Tefachim</text><rect x="120.0" y="340.0" width="150.0" height="30.0" fill="#101515" stroke="#CFB36D" stroke-width="2"/><line x1="145.0" y1="340.0" x2="145.0" y2="370.0" stroke="#CFB36D" stroke-width="1"/><line x1="170.0" y1="340.0" x2="170.0" y2="370.0" stroke="#CFB36D" stroke-width="1"/><line x1="195.0" y1="340.0" x2="195.0" y2="370.0" stroke="#CFB36D" stroke-width="1"/><line x1="220.0" y1="340.0" x2="220.0" y2="370.0" stroke="#CFB36D" stroke-width="1"/><line x1="245.0" y1="340.0" x2="245.0" y2="370.0" stroke="#CFB36D" stroke-width="1"/><line x1="120.0" y1="392.0" x2="270.0" y2="392.0" stroke="#CFB36D" stroke-width="1"/><line x1="120.0" y1="388.0" x2="120.0" y2="396.0" stroke="#CFB36D" stroke-width="1"/><line x1="270.0" y1="388.0" x2="270.0" y2="396.0" stroke="#CFB36D" stroke-width="1"/><text x="195.0" y="385.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">6 Tefachim</text><text x="390.0" y="324.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="12">Geräte-Ammah · fünf Tefachim</text><rect x="390.0" y="340.0" width="125.0" height="30.0" fill="#101515" stroke="#A89F8E" stroke-width="2"/><line x1="415.0" y1="340.0" x2="415.0" y2="370.0" stroke="#A89F8E" stroke-width="1"/><line x1="440.0" y1="340.0" x2="440.0" y2="370.0" stroke="#A89F8E" stroke-width="1"/><line x1="465.0" y1="340.0" x2="465.0" y2="370.0" stroke="#A89F8E" stroke-width="1"/><line x1="490.0" y1="340.0" x2="490.0" y2="370.0" stroke="#A89F8E" stroke-width="1"/><line x1="390.0" y1="392.0" x2="515.0" y2="392.0" stroke="#A89F8E" stroke-width="1"/><line x1="390.0" y1="388.0" x2="390.0" y2="396.0" stroke="#A89F8E" stroke-width="1"/><line x1="515.0" y1="388.0" x2="515.0" y2="396.0" stroke="#A89F8E" stroke-width="1"/><text x="452.5" y="385.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">5 Tefachim</text><rect x="515.0" y="340.0" width="25.0" height="30.0" fill="url(#rHatchQ)" stroke="#6E9EAA" stroke-width="1" stroke-dasharray="3 3"/><text x="554.0" y="360.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11">das eine Tefach Unterschied · Keilim 17:10</text><text x="120.0" y="450.0" fill="#F2EAD9" font-family="Cormorant Garamond, Georgia, serif" font-size="16">1 Kaneh = 6 Ammot = 36 Tefachim</text><text x="120.0" y="474.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Die Karte rechnet nicht weiter: keine Länge einer Ammah in cm, keine Etzba-Kette.</text><text x="820.0" y="290.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Außenmauer · Querschnitt</text><rect x="820.0" y="310.0" width="130.0" height="130.0" fill="#101515" stroke="url(#rWall)" stroke-width="4"/><line x1="820.0" y1="304.0" x2="950.0" y2="304.0" stroke="#D7BD87" stroke-width="1"/><line x1="820.0" y1="300.0" x2="820.0" y2="308.0" stroke="#D7BD87" stroke-width="1"/><line x1="950.0" y1="300.0" x2="950.0" y2="308.0" stroke="#D7BD87" stroke-width="1"/><text x="885.0" y="297.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">1 Kaneh</text><line x1="810.0" y1="310.0" x2="810.0" y2="440.0" stroke="#D7BD87" stroke-width="1"/><line x1="806.0" y1="310.0" x2="814.0" y2="310.0" stroke="#D7BD87" stroke-width="1"/><line x1="806.0" y1="440.0" x2="814.0" y2="440.0" stroke="#D7BD87" stroke-width="1"/><text x="802.0" y="375.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle" transform="rotate(-90 802.0 375.0)">1 Kaneh</text><text x="820.0" y="464.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Dicke und Höhe je ein Kaneh · Jechezkel 40:5</text><line x1="46.0" y1="686.0" x2="1194.0" y2="686.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="694.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="702.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Ammah / Kaneh — Maß der Vision, sechs Tefachim</text><rect x="46.0" y="712.0" width="16.0" height="9.0" fill="#A89F8E" opacity=".85"/><text x="70.0" y="720.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Geräte-Ammah — fünf Tefachim, zum Vergleich</text><rect x="46.0" y="730.0" width="16.0" height="9.0" fill="#6E9EAA" opacity=".85"/><text x="70.0" y="738.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Unterschied — das eine Tefach nach Keilim 17:10</text><text x="645.0" y="700.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="718.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Umrechnung in cm oder m</text><text x="645.0" y="734.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Etzba-Unterteilung</text><text x="645.0" y="750.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Bauteile außer der Außenmauer</text><text x="620.0" y="798.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Einheitendefinition · keine absolute Skala · kein Bauplan</text></svg>