<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Höhenschema — Even HaSchtijah — innerer Referenzpunkt</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="880.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 02 · Höhenschema</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">אֶבֶן הַשְּׁתִיָּה — צִיר הַבַּיִת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Even HaSchtijah — innerer Referenzpunkt</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Höhen in der Einheit der Quelle · Tefachim und Ammot nicht ineinander umgerechnet</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><line x1="80.0" y1="640.0" x2="1160.0" y2="640.0" stroke="#B8925D" stroke-width="2"/><text x="80.0" y="630.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">Bodenlinie · Bezug der Karte</text><rect x="150.0" y="502.0" width="120.0" height="138.0" fill="#101515" stroke="url(#rWall)" stroke-width="3"/><line x1="136.0" y1="502.0" x2="136.0" y2="640.0" stroke="#D7BD87" stroke-width="1"/><line x1="132.0" y1="502.0" x2="140.0" y2="502.0" stroke="#D7BD87" stroke-width="1"/><line x1="132.0" y1="640.0" x2="140.0" y2="640.0" stroke="#D7BD87" stroke-width="1"/><text x="128.0" y="571.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle" transform="rotate(-90 128.0 571.0)">3 Etzba’ot</text><text x="210.0" y="662.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Höhe der Oberfläche</text><text x="210.0" y="678.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Mischna Joma 5:2</text><text x="820.0" y="234.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Lage des Steins · Rambam, Beit HaBechirah 4:1</text><rect x="820.0" y="250.0" width="260.0" height="150.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1.5" stroke-dasharray="6 5"/><text x="950.0" y="330.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">nicht überliefert</text><text x="820.0" y="426.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Mit Lade; Westteil des Kodesch HaKodashim, ohne Wandabstand.</text><line x1="46.0" y1="746.0" x2="1194.0" y2="746.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="754.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="762.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">durchgezogen — Maß und Achse belegt</text><rect x="46.0" y="772.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="780.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — Achse oder Maß in der Karte strittig oder offen</text><rect x="46.0" y="790.0" width="16.0" height="9.0" fill="#6E9EAA" opacity=".85"/><text x="70.0" y="798.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">eigene Ebene — andere Quellenschicht</text><text x="645.0" y="760.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="778.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Lage des Steins (keine Maßzahl)</text><text x="645.0" y="794.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Grundfläche des Steins</text><text x="620.0" y="858.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Höhenschema · Einheiten getrennt · keine Umrechnung · kein Zukunftsbauplan</text></svg>