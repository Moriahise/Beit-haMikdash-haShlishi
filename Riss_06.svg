<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1010" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Terumah · Landplan mit getrennten Skalen — Der heilige Bezirk in Jechezkel 45</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1010.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 06 · Terumah · Landplan mit getrennten Skalen</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">תְּרוּמַת הַקֹּדֶשׁ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Der heilige Bezirk in Jechezkel 45</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">25.000/10.000/5.000 ohne Einheit · 500 × 500 eigene Ebene · Migrasch 50 Ammah</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="95.0" y="175.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1.1">LANDPLAN · ZAHLEN BELEGT, EINHEIT NICHT GENANNT</text><rect x="95.0" y="220.0" width="620.0" height="230.0" fill="#101515" stroke="#D7BD87" stroke-width="2"/><text x="119.0" y="258.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13">PRIESTERABSCHNITT</text><text x="691.0" y="258.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="end">25.000 × 10.000 · Einheit offen</text><rect x="95.0" y="450.0" width="620.0" height="230.0" fill="#0B0E0E" stroke="#9EC2C7" stroke-width="2"/><text x="119.0" y="488.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13">LEVITENABSCHNITT</text><text x="691.0" y="488.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="end">25.000 × 10.000 · Einheit offen</text><rect x="95.0" y="680.0" width="620.0" height="115.0" fill="#101515" stroke="#CFB36D" stroke-width="2"/><text x="119.0" y="718.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13">STADTANTEIL</text><text x="691.0" y="718.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="end">25.000 × 5.000 · Einheit offen</text><line x1="95.0" y1="829.0" x2="715.0" y2="829.0" stroke="#F2EAD9" stroke-width="1"/><line x1="95.0" y1="825.0" x2="95.0" y2="833.0" stroke="#F2EAD9" stroke-width="1"/><line x1="715.0" y1="825.0" x2="715.0" y2="833.0" stroke="#F2EAD9" stroke-width="1"/><text x="405.0" y="822.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">25.000 · gemeinsame Längenzahl</text><text x="405.0" y="861.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Vertikale Anordnung ist Ordnungsschema; der Text gibt keine moderne Karte.</text><text x="825.0" y="175.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1">HEILIGTUMSQUADRAT · EIGENE SKALA</text><rect x="825.0" y="250.0" width="250.0" height="250.0" fill="#101515" stroke="#9EC2C7" stroke-width="2" stroke-dasharray="7 6"/><text x="950.0" y="345.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="18" text-anchor="middle">500 × 500</text><text x="950.0" y="372.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Einheit im Vers offen</text><text x="950.0" y="400.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Raschi/Malbim: Kanim</text><rect x="805.0" y="230.0" width="290.0" height="290.0" fill="none" stroke="#CFB36D" stroke-width="2"/><text x="950.0" y="548.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Migrasch 50 Ammah ringsum</text><text x="825.0" y="625.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">MIKDASCH-GEBÄUDE</text><rect x="825.0" y="655.0" width="250.0" height="105.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5"/><text x="950.0" y="702.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">innerhalb des Priesterabschnitts</text><text x="950.0" y="724.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Lage und Maße auf dieser Karte offen</text><line x1="46.0" y1="876.0" x2="1194.0" y2="876.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="884.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="892.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Priester — 25.000 × 10.000</text><rect x="46.0" y="902.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Leviten — 25.000 × 10.000</text><rect x="46.0" y="920.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="928.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Ammah-Ring — 50 ringsum, nicht auf Großzahlen übertragen</text><text x="645.0" y="890.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="908.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Einheit der Großzahlen</text><text x="645.0" y="924.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gleichsetzung von 500 mit Ammot</text><text x="645.0" y="940.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gebäudemaße des Mikdasch</text><text x="645.0" y="956.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· moderne Landkoordinaten</text><text x="620.0" y="988.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Landplan · Maßebenen getrennt · keine Umrechnung oder moderne Kartierung</text></svg>