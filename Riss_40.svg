<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1080" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Pflaster und Hiddur · Zustandsordnung — Hofpflaster, Festigkeit und Verschönerung</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1080.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 40 · Pflaster und Hiddur · Zustandsordnung</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">רִצְפַּת הָעֲזָרָה וּפְאֵר הַבַּיִת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Hofpflaster, Festigkeit und Verschönerung</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Keine Maßzahl · Pflichtzustand und drei bedingte Hiddur-Stufen</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="166.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing=".8">PFLICHTZUSTAND UND HIDDUR-STUFEN · KEINE FORMATE ODER GOLDMENGEN</text><rect x="80.0" y="220.0" width="560.0" height="430.0" fill="#101515" stroke="#D7BD87" stroke-width="2" rx="9"/><text x="105.0" y="255.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">PFLICHT · GESAMTE ASARAH GEPFLASTERT</text><rect x="145.0" y="305.0" width="420.0" height="245.0" fill="url(#rHatchQ)" stroke="#9EC2C7" stroke-width="2"/><text x="355.0" y="415.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="15" text-anchor="middle">kostbare Steine</text><text x="355.0" y="445.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Format · Muster · Dicke · Schichten offen</text><rect x="455.0" y="485.0" width="68.0" height="52.0" fill="#C96B62" stroke="#D7A09A" stroke-width="2" stroke-dasharray="5 4"/><text x="489.0" y="573.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">gelöst = untauglich, auch am Ort</text><text x="355.0" y="610.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">offene Stelle: dort keine ordnungsgemäße Verrichtung</text><rect x="700.0" y="220.0" width="470.0" height="430.0" fill="#101515" stroke="#CFB36D" stroke-width="2" rx="9"/><text x="725.0" y="255.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="11">BAULICHER HIDDUR · NACH KRAFT DER GEMEINSCHAFT</text><rect x="740.0" y="300.0" width="265.0" height="56.0" fill="#0B0E0E" stroke="#D7BD87" stroke-width="1.5" rx="5"/><text x="758.0" y="324.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10">Pflicht</text><text x="758.0" y="344.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="9">Pflaster + fester Zustand</text><rect x="740.0" y="376.0" width="310.0" height="56.0" fill="#0B0E0E" stroke="#9EC2C7" stroke-width="1.5" rx="5"/><text x="758.0" y="400.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10">Hiddur I</text><text x="758.0" y="420.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="9">stärken + erhöhen · Zielhöhe offen</text><rect x="740.0" y="452.0" width="355.0" height="56.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.5" rx="5"/><text x="758.0" y="476.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="10">Hiddur II</text><text x="758.0" y="496.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="9">verschönern + verzieren · Umfang offen</text><rect x="740.0" y="528.0" width="400.0" height="56.0" fill="url(#rHatchQ)" stroke="#D6B95F" stroke-width="1.5" rx="5"/><text x="758.0" y="552.0" fill="#D6B95F" font-family="EB Garamond, Georgia, serif" font-size="10">Hiddur III</text><text x="758.0" y="572.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="9">vergolden, wenn möglich · Fläche/Stärke offen</text><rect x="80.0" y="720.0" width="1090.0" height="100.0" fill="#0B0E0E" stroke="#C96B62" stroke-width="1.4" stroke-dasharray="6 5"/><text x="625.0" y="755.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Vergoldungsreferenz</text><text x="625.0" y="786.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Haus mit Gold überzogen · ausdrücklich nicht hinter den Türen · keine Goldfläche abgeleitet</text><line x1="46.0" y1="946.0" x2="1194.0" y2="946.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="954.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="962.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Pflicht — ganze Asarah · fest verankert</text><rect x="46.0" y="972.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="980.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Hiddur — Steigerung nach Kraft der Gemeinschaft</text><rect x="46.0" y="990.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="998.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offen/untauglich — gelöster Stein oder unbestimmte Ausführung</text><text x="645.0" y="960.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="978.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Steinformat und Verlegemuster</text><text x="645.0" y="994.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Zielhöhe</text><text x="645.0" y="1010.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Verzierungsflächen</text><text x="645.0" y="1026.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Goldstärke und Goldfläche</text><text x="620.0" y="1058.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Hofpflaster und Hiddur · Normstufen, kein Ausführungsdetail</text></svg>