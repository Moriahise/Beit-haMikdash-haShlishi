<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1020" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Südlicher Zugang · Schnittstellenschema — Der südliche Zugang und die Schnittstelle zum Berg</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1020.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 33 · Südlicher Zugang · Schnittstellenschema</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">מִדָּרוֹם אֶל הָהָר</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Der südliche Zugang und die Schnittstelle zum Berg</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">B: Amot am Tor · D: Meter als Befundlage · Ebenen getrennt</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="166.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1.1">B-REFERENZPLAN UND D-BEFUND · KEINE TORZUORDNUNG</text><rect x="70.0" y="205.0" width="1100.0" height="330.0" fill="#101515" stroke="#B8925D" stroke-width="1.5" rx="9"/><text x="95.0" y="238.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="12">B · SÜDSEITE DES HAR HABAJIT</text><line x1="260.0" y1="335.0" x2="1080.0" y2="335.0" stroke="#D7BD87" stroke-width="9"/><rect x="475.0" y="320.0" width="60.0" height="30.0" fill="#0B0E0E" stroke="#9EC2C7" stroke-width="2" stroke-dasharray="5 4"/><text x="505.0" y="300.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Chuldah 1</text><text x="505.0" y="378.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Position schematisch</text><rect x="785.0" y="320.0" width="60.0" height="30.0" fill="#0B0E0E" stroke="#9EC2C7" stroke-width="2" stroke-dasharray="5 4"/><text x="815.0" y="300.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Chuldah 2</text><text x="815.0" y="378.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Position schematisch</text><text x="670.0" y="430.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">2 Tore an der Südseite · Koordinaten entlang der Mauer nicht angegeben</text><rect x="880.0" y="400.0" width="210.0" height="82.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.5"/><text x="985.0" y="430.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">lichte Öffnung</text><text x="985.0" y="458.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">10 breit × 20 hoch · Amot</text><rect x="70.0" y="575.0" width="1100.0" height="240.0" fill="#101515" stroke="#6E9EAA" stroke-width="1.5" rx="9"/><text x="95.0" y="608.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12">D · FRÜHRÖMISCHER STRASSENKORRIDOR</text><path d="M175 765 C245 720 285 675 335 625" fill="none" stroke="#9EC2C7" stroke-width="8" stroke-dasharray="10 7"/><path d="M335 625 l-16 5 l11 12 z" fill="#9EC2C7"/><text x="245.0" y="700.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Korridor zum Bereich der Südwestecke</text><line x1="500.0" y1="635.0" x2="500.0" y2="765.0" stroke="#D7BD87" stroke-width="1.5"/><line x1="530.0" y1="635.0" x2="530.0" y2="765.0" stroke="#D7BD87" stroke-width="1"/><line x1="526.0" y1="635.0" x2="534.0" y2="635.0" stroke="#D7BD87" stroke-width="1"/><line x1="526.0" y1="765.0" x2="534.0" y2="765.0" stroke="#D7BD87" stroke-width="1"/><text x="522.0" y="700.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 522.0 700.0)">ca. 360 m südlich · Lage des untersuchten Abschnitts</text><text x="735.0" y="695.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">360 m ist keine Länge der Gesamtstraße</text><text x="735.0" y="728.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Zieltor historisch und künftig offen</text><line x1="620.0" y1="545.0" x2="620.0" y2="835.0" stroke="#C96B62" stroke-width="2" stroke-dasharray="7 6"/><line x1="46.0" y1="886.0" x2="1194.0" y2="886.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="894.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="902.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">B-Ebene — zwei Chuldah-Tore, Öffnung 10 × 20</text><rect x="46.0" y="912.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="920.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">D-Ebene — Straßenkorridor zur Südwestecke</text><rect x="46.0" y="930.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="938.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offen — keine Zuordnung Straße → bestimmtes Tor</text><text x="645.0" y="900.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="918.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Positionen der beiden Tore</text><text x="645.0" y="934.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gesamtlänge der Straße</text><text x="645.0" y="950.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· historisches Zieltor</text><text x="645.0" y="966.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· künftige Straßenführung</text><text x="620.0" y="998.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Südlicher Zugang · halachischer Referenzplan und Archäologie nicht verschmolzen</text></svg>