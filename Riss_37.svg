<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1020" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Baukörperordnung · Pflichtklassen — Die unverzichtbaren Baukörper</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1020.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 37 · Baukörperordnung · Pflichtklassen</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">עִקְּרֵי הַבִּנְיָן</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die unverzichtbaren Baukörper</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Ohne Maßstab · nur Zugehörigkeit, Reihenfolge und Umfassung</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="166.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1">RÄUMLICHE ORDNUNG · AUF DIESER KARTE OHNE MASSZAHLEN</text><rect x="125.0" y="215.0" width="990.0" height="545.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="2" rx="12"/><text x="150.0" y="250.0" fill="#D7A09A" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="15">עֲזָרָה · ASARAH</text><text x="150.0" y="276.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10">Pflichtumfassung ringsum · Abstand zum Heichal offen</text><rect x="760.0" y="385.0" width="220.0" height="180.0" fill="#101515" stroke="#D7BD87" stroke-width="2" rx="7"/><text x="870.0" y="455.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="18" text-anchor="middle">אוּלָם</text><text x="870.0" y="492.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Ulam · vor dem Kodesch</text><rect x="510.0" y="385.0" width="220.0" height="180.0" fill="#101515" stroke="#D7BD87" stroke-width="2" rx="7"/><text x="620.0" y="455.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="18" text-anchor="middle">קֹדֶשׁ</text><text x="620.0" y="492.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Kodesch · mittlere Raumklasse</text><rect x="260.0" y="385.0" width="220.0" height="180.0" fill="#101515" stroke="#CFB36D" stroke-width="2" rx="7"/><text x="370.0" y="455.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="18" text-anchor="middle">קֹדֶשׁ הַקֳּדָשִׁים</text><text x="370.0" y="492.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">innerste Raumklasse</text><line x1="230.0" y1="350.0" x2="1010.0" y2="350.0" stroke="#D7BD87" stroke-width="1.5"/><text x="620.0" y="335.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">HEICHAL · gemeinsamer Name für die drei Raumklassen</text><rect x="160.0" y="610.0" width="105.0" height="60.0" fill="#101515" stroke="#6E9EAA" stroke-width="1.3" stroke-dasharray="5 4"/><text x="212.5" y="646.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Lischkah</text><rect x="980.0" y="610.0" width="105.0" height="60.0" fill="#101515" stroke="#6E9EAA" stroke-width="1.3" stroke-dasharray="5 4"/><text x="1032.5" y="646.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Lischkah</text><rect x="160.0" y="315.0" width="105.0" height="60.0" fill="#101515" stroke="#6E9EAA" stroke-width="1.3" stroke-dasharray="5 4"/><text x="212.5" y="351.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">innere Grenze</text><rect x="980.0" y="315.0" width="105.0" height="60.0" fill="#101515" stroke="#6E9EAA" stroke-width="1.3" stroke-dasharray="5 4"/><text x="1032.5" y="351.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">innere Grenze</text><text x="620.0" y="715.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Lischkot und innere Grenzen gehören in die Asarah · Zahl und genaue Lage offen</text><line x1="46.0" y1="886.0" x2="1194.0" y2="886.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="894.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="902.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Heichal — Ulam + Kodesch + Kodesch HaKodaschim</text><rect x="46.0" y="912.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="920.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Asarah — Pflichtumfassung, Abstand offen</text><rect x="46.0" y="930.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="938.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Ergänzungen — innere Grenzen und Lischkot</text><text x="645.0" y="900.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="918.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Raummaße aus Detailkarten</text><text x="645.0" y="934.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Abstand Asarah–Heichal</text><text x="645.0" y="950.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Anzahl und Position der Lischkot</text><text x="645.0" y="966.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gestalt der inneren Grenzen</text><text x="620.0" y="998.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Unverzichtbare Bauklassen · räumliche Hierarchie, kein Detailgrundriss</text></svg>