"/><rect x="46.0" y="894.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="902.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Zellen/Passage — belegte Einzelmaße</text><rect x="46.0" y="912.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="920.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Gevul/Pfeiler — eigene Bauteile</text><rect x="46.0" y="930.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="938.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offen/strittig — 50-Achse und 60-Crux</text><text x="645.0" y="900.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="918.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Torhaus als einfache 50 × 25-Box</text><text x="645.0" y="934.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhe aus der Zahl 13</text><text x="645.0" y="950.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Toranzahl 13</text><text x="645.0" y="966.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Wandstärken und Stufenzahl</text><text x="620.0" y="998.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Torhaus · Teilmaße nicht zwangssummiert · 50-Lesungen getrennt</text></svg>