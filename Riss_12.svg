<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1020" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Torhaus · Zellmodul und Messlinien — Die Torbaugruppen Jechezkels — 50 auf 25</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1020.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 12 · Torhaus · Zellmodul und Messlinien</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">שַׁעֲרֵי יְחֶזְקֵאל — 50 × 25</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die Torbaugruppen Jechezkels — 50 auf 25</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Zellen 6 × 6 · Wände 5 · Passage 10 · Messlinien separat</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="75.0" y="175.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1.2">ZELLMODUL UND PASSAGE · GRUNDRISS</text><rect x="105.0" y="255.0" width="54.0" height="54.0" fill="#6E9EAA" stroke="#9EC2C7" stroke-width="1" opacity=".32"/><text x="132.0" y="286.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">6 × 6</text><rect x="159.0" y="255.0" width="45.0" height="54.0" fill="#B8925D" stroke="#D7BD87" stroke-width="1" opacity=".7"/><text x="181.5" y="286.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">5</text><rect x="204.0" y="255.0" width="54.0" height="54.0" fill="#6E9EAA" stroke="#9EC2C7" stroke-width="1" opacity=".32"/><text x="231.0" y="286.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">6 × 6</text><rect x="258.0" y="255.0" width="45.0" height="54.0" fill="#B8925D" stroke="#D7BD87" stroke-width="1" opacity=".7"/><text x="280.5" y="286.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">5</text><rect x="303.0" y="255.0" width="54.0" height="54.0" fill="#6E9EAA" stroke="#9EC2C7" stroke-width="1" opacity=".32"/><text x="330.0" y="286.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">6 × 6</text><rect x="105.0" y="417.0" width="54.0" height="54.0" fill="#6E9EAA" stroke="#9EC2C7" stroke-width="1" opacity=".32"/><text x="132.0" y="448.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">6 × 6</text><rect x="159.0" y="417.0" width="45.0" height="54.0" fill="#B8925D" stroke="#D7BD87" stroke-width="1" opacity=".7"/><text x="181.5" y="448.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">5</text><rect x="204.0" y="417.0" width="54.0" height="54.0" fill="#6E9EAA" stroke="#9EC2C7" stroke-width="1" opacity=".32"/><text x="231.0" y="448.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">6 × 6</text><rect x="258.0" y="417.0" width="45.0" height="54.0" fill="#B8925D" stroke="#D7BD87" stroke-width="1" opacity=".7"/><text x="280.5" y="448.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">5</text><rect x="303.0" y="417.0" width="54.0" height="54.0" fill="#6E9EAA" stroke="#9EC2C7" stroke-width="1" opacity=".32"/><text x="330.0" y="448.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">6 × 6</text><rect x="105.0" y="309.0" width="252.0" height="9.0" fill="#CFB36D" stroke="#CFB36D" stroke-width="1"/><rect x="105.0" y="408.0" width="252.0" height="9.0" fill="#CFB36D" stroke="#CFB36D" stroke-width="1"/><rect x="105.0" y="318.0" width="252.0" height="90.0" fill="url(#rHatchQ)" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="6 5"/><text x="231.0" y="363.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">PASSAGE · LICHTE BREITE 10</text><text x="373.0" y="317.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="9">Gevul 1</text><line x1="105.0" y1="231.0" x2="357.0" y2="231.0" stroke="#F2EAD9" stroke-width="1"/><line x1="105.0" y1="227.0" x2="105.0" y2="235.0" stroke="#F2EAD9" stroke-width="1"/><line x1="357.0" y1="227.0" x2="357.0" y2="235.0" stroke="#F2EAD9" stroke-width="1"/><text x="231.0" y="224.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">6 + 5 + 6 + 5 + 6 = 28 · sichtbare Modulrechnung</text><text x="730.0" y="175.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" letter-spacing="1">SEPARATE MESSLINIEN · NICHT ZU EINER BOX ADDIERT</text><rect x="730.0" y="245.0" width="108.0" height="28.0" fill="#D7BD87" stroke="#F2EAD9" stroke-width="1" opacity=".55"/><text x="852.0" y="264.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10">Schwelle · 6 Amot</text><rect x="730.0" y="317.0" width="144.0" height="28.0" fill="#9EC2C7" stroke="#F2EAD9"