<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1100" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Fenster, Türen und Oberflächen · Bestandsschema — Fenster, Türen und Innenoberflächen bei Jechezkel</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1100.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 41 · Fenster, Türen und Oberflächen · Bestandsschema</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">חַלּוֹנוֹת, דְּלָתוֹת וְחִפּוּיֵי הַבַּיִת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Fenster, Türen und Innenoberflächen bei Jechezkel</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Jechezkel-Ebene ohne Baumaße · Stückzahlen nur bei Türen</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="166.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1">JECHESKEL 41 · BESTANDTEILE BELEGT, DIMENSIONEN OFFEN</text><rect x="100.0" y="220.0" width="760.0" height="500.0" fill="#101515" stroke="#D7BD87" stroke-width="2" rx="10"/><text x="480.0" y="255.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">HAUSOBERFLÄCHEN · SCHEMATISCH</text><rect x="190.0" y="310.0" width="580.0" height="320.0" fill="#0B0E0E" stroke="#B8925D" stroke-width="5"/><rect x="215.0" y="335.0" width="530.0" height="270.0" fill="url(#rHatchQ)" stroke="#6E9EAA" stroke-width="1.5"/><text x="480.0" y="455.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">Holzverkleidung ringsum</text><text x="480.0" y="485.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Stärke und genaue Flächen offen</text><rect x="275.0" y="355.0" width="54.0" height="42.0" fill="#101515" stroke="#C96B62" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="390.0" y="355.0" width="54.0" height="42.0" fill="#101515" stroke="#C96B62" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="570.0" y="355.0" width="54.0" height="42.0" fill="#101515" stroke="#C96B62" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="685.0" y="355.0" width="54.0" height="42.0" fill="#101515" stroke="#C96B62" stroke-width="1.4" stroke-dasharray="5 4"/><text x="480.0" y="420.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Fenster ringsum · Bedeutung und Maße offen</text><rect x="395.0" y="530.0" width="170.0" height="100.0" fill="#101515" stroke="#F2EAD9" stroke-width="2"/><line x1="480.0" y1="530.0" x2="480.0" y2="630.0" stroke="#F2EAD9" stroke-width="1.5"/><text x="480.0" y="662.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">2 Türen · je 2 wendende Teile · keine Dimension</text><line x1="220.0" y1="505.0" x2="740.0" y2="505.0" stroke="#CFB36D" stroke-width="4" stroke-dasharray="8 5"/><text x="480.0" y="520.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Ornamentband: Boden bis über Öffnung · Größe offen</text><rect x="910.0" y="220.0" width="260.0" height="220.0" fill="#101515" stroke="#9EC2C7" stroke-width="1.7" rx="8"/><text x="1040.0" y="258.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">ULAM-FRONT</text><rect x="960.0" y="315.0" width="160.0" height="18.0" fill="#8F653D" stroke="#D7BD87" stroke-width="1.5"/><text x="1040.0" y="365.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Holzbauteil belegt</text><text x="1040.0" y="392.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Form und Maß offen</text><rect x="910.0" y="485.0" width="260.0" height="135.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1.7" rx="8"/><text x="1040.0" y="525.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">TÜRPFOSTEN</text><text x="1040.0" y="558.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="15" text-anchor="middle">מְזוּזַת רְבֻעָה</text><text x="1040.0" y="590.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Bedeutung nicht abschließend</text><rect x="100.0" y="785.0" width="1070.0" height="72.0" fill="#0B0E0E" stroke="#C96B62" stroke-width="1.5" stroke-dasharray="6 5"/><text x="635.0" y="814.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Ausgeschlossen: Gegenstand 41:22 · 3 Amot hoch, 2 Amot lang</text><text x="635.0" y="841.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Der Vers nennt ihn Tisch; er ist kein Bauteil dieses Risses.</text><line x1="46.0" y1="966.0" x2="1194.0" y2="966.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="974.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="982.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Holzverkleidung — ringsum · Stärke offen</text><rect x="46.0" y="992.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="1000.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Fenster/Pfosten — Bedeutung oder Maß offen</text><rect x="46.0" y="1010.0" width="16.0" height="9.0" fill="#F2EAD9" opacity=".85"/><text x="70.0" y="1018.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Türen — 2 · je 2 wendende Teile</text><text x="645.0" y="980.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="998.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Türmaße aus Ebene B</text><text x="645.0" y="1014.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Fenstermaße</text><text x="645.0" y="1030.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Ornamentgrößen</text><text x="645.0" y="1046.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gegenstand/Tisch aus 41:22</text><text x="620.0" y="1078.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Jechezkel 41 · Bestandteile und Reichweiten, kein Fassadenentwurf</text></svg>