<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Wegbeziehung · relative Topologie — Die rabbinische Verbindung Schiloach–Mikdasch</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 28 · Wegbeziehung · relative Topologie</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">הַקֶּשֶׁר בֵּין הַשִּׁלֹחַ לַמִּקְדָּשׁ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die rabbinische Verbindung Schiloach–Mikdasch</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Ohne Maßstab · nur Ausgang, Ziel und relative Richtung</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="84.0" y="166.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1.2">RELATIVE TOPOLOGIE · KEINE ROUTENREKONSTRUKTION</text><text x="1125.0" y="178.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="14" text-anchor="middle">N</text><line x1="1125.0" y1="190.0" x2="1125.0" y2="248.0" stroke="#F2EAD9" stroke-width="2"/><path d="M1125 184 l-7 13 h14 z" fill="#F2EAD9"/><text x="620.0" y="246.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle" letter-spacing="1">AZARAH · SÜDWAND</text><line x1="430.0" y1="280.0" x2="1080.0" y2="280.0" stroke="#D7BD87" stroke-width="8"/><text x="430.0" y="306.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">W</text><text x="1080.0" y="306.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">O</text><rect x="510.0" y="267.0" width="54.0" height="26.0" fill="#0B0E0E" stroke="#9EC2C7" stroke-width="2"/><text x="537.0" y="245.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Wassertor</text><text x="537.0" y="326.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">in der Südreihe · nahe dem Westen</text><rect x="100.0" y="670.0" width="300.0" height="86.0" fill="#101515" stroke="#9EC2C7" stroke-width="2" rx="9"/><text x="250.0" y="702.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="17" text-anchor="middle">שִׁלֹחַ</text><text x="250.0" y="728.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Ausgangspunkt · südlich</text><rect x="795.0" y="650.0" width="340.0" height="108.0" fill="#101515" stroke="#D7A09A" stroke-width="2" stroke-dasharray="7 5" rx="9"/><text x="965.0" y="682.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="17" text-anchor="middle">שַׁעַר הַמַּיִם</text><text x="965.0" y="708.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Stadtmauer · anderes Bauwerk</text><path d="M250 670 C300 570 355 500 430 448 C480 412 515 360 537 295" fill="none" stroke="#9EC2C7" stroke-width="3" stroke-dasharray="8 7"/><path d="M537 294 l-10 15 h20 z" fill="#9EC2C7"/><text x="360.0" y="535.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">von Süd aufwärts nach Nord</text><text x="360.0" y="558.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Verlauf · Länge · Breite · Gefälle offen</text><line x1="620.0" y1="620.0" x2="620.0" y2="800.0" stroke="#C96B62" stroke-width="2" stroke-dasharray="6 6"/><text x="606.0" y="710.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 606.0 710.0)">keine Identität der beiden Wassertore</text><rect x="100.0" y="820.0" width="1035.0" height="52.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1.2"/><text x="618.0" y="852.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Die historische Straße aus Karte 31 liefert keine Norm für diesen liturgischen Weg.</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">belegte Beziehung — Schiloach → Wassertor der Azarah</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Südwand — Tor nur relativ nahe Westen</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Trennung — Stadttor und historische Straße nicht gleichgesetzt</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· genauer Verlauf</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Länge und Breite</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gefälle und Höhenprofil</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Identität mit dem Stadttor</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Texttopologie · keine Distanz · keine historische oder zukünftige Straßenrekonstruktion</text></svg>