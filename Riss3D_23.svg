.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Zellhöhen, Fenster- und Öffnungsmaße bleiben offen.</text><line x1="46" y1="756" x2="68.11204710797249" y2="756" stroke="#D7BD87" stroke-width="3"/><text x="78.1" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">1 Ammot (in der Bodenebene)</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Zellplatte — 6 × 6 Ammot</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Zwischenwand — 5 Ammot</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#8F653D" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Gevul — 1 Ammah je Seite</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Passagebreite</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Zellhöhen</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Fenster- und Öffnungsmaße</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Verwendung</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Torzellen · Grundrissmaßstäblich · Höhe nicht aufgestellt</text></svg>