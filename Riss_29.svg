<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Schwellenwasser · Lage- und Fließschema — Jechezkel 47 — Wasser unter der Schwelle</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1000.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 29 · Schwellenwasser · Lage- und Fließschema</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">מַיִם מִתַּחַת מִפְתַּן הַבַּיִת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Jechezkel 47 — Wasser unter der Schwelle</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Ohne Maßstab · relative Lage und Richtung aus Jechezkel 47:1–2</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="166.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1.2">JECHESKEL 47:1–2 · ZWEI BEOBACHTUNGSPUNKTE</text><rect x="110.0" y="265.0" width="430.0" height="210.0" fill="#101515" stroke="#D7BD87" stroke-width="2" rx="8"/><text x="325.0" y="305.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">הַבַּיִת · DAS HAUS</text><line x1="155.0" y1="385.0" x2="495.0" y2="385.0" stroke="#D7BD87" stroke-width="10"/><text x="325.0" y="414.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Schwelle · Öffnungsform nicht beschrieben</text><rect x="275.0" y="374.0" width="100.0" height="22.0" fill="#0B0E0E" stroke="#9EC2C7" stroke-width="2"/><text x="325.0" y="356.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Austritt unter der Schwelle</text><rect x="175.0" y="560.0" width="150.0" height="72.0" fill="#101515" stroke="#8F653D" stroke-width="2" rx="7"/><text x="250.0" y="590.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="15" text-anchor="middle">מִזְבֵּחַ</text><text x="250.0" y="614.0" fill="#8F653D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">nur Lageanker</text><text x="355.0" y="595.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">südlich</text><line x1="375.0" y1="385.0" x2="810.0" y2="385.0" stroke="#9EC2C7" stroke-width="3"/><path d="M810 385 l-14 -7 l4 14 z" fill="#9EC2C7"/><text x="610.0" y="360.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Wasser ostwärts · קָדִימָה</text><text x="610.0" y="414.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Menge · Breite · Tiefe · Profil nicht angegeben</text><rect x="850.0" y="310.0" width="270.0" height="150.0" fill="#101515" stroke="#9EC2C7" stroke-width="2" rx="8"/><text x="985.0" y="350.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">שַׁעַר הַקָּדִים</text><text x="985.0" y="379.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">äußeres Osttor</text><text x="985.0" y="405.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">zweiter Blick auf dasselbe Wasser</text><path d="M325 265 C330 195 520 195 610 225 C720 260 820 270 900 310" fill="none" stroke="#D7BD87" stroke-width="2" stroke-dasharray="7 6"/><text x="610.0" y="213.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Beobachterweg: durch das Nordtor · außen zum Osttor</text><line x1="610.0" y1="224.0" x2="610.0" y2="180.0" stroke="#D7BD87" stroke-width="2"/><text x="610.0" y="168.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">N</text><rect x="110.0" y="705.0" width="1010.0" height="92.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1.5"/><text x="615.0" y="740.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">Keine hydraulische Form wird ergänzt</text><text x="615.0" y="770.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Öffnung, Fuge, Rinne oder Rohr bleiben ausdrücklich unbestimmt.</text><line x1="46.0" y1="866.0" x2="1194.0" y2="866.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="874.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="882.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Wasser — Austritt unter der Schwelle · ostwärts</text><rect x="46.0" y="892.0" width="16.0" height="9.0" fill="#8F653D" opacity=".85"/><text x="70.0" y="900.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Mizbeach — nur südlicher Lageanker</text><rect x="46.0" y="910.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="918.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Beobachterweg — Nordtor → außen → Osttor</text><text x="645.0" y="880.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Austrittsquerschnitt</text><text x="645.0" y="914.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Wassermenge und Gefälle</text><text x="645.0" y="930.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Breite und Tiefe</text><text x="645.0" y="946.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· technische Verbindung zum Wassertor</text><text x="620.0" y="978.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Relative Texttopologie · kein hydraulischer Bauplan · kein numerisches Maß</text></svg>