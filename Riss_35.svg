09A" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Radak</text><text x="482.5" y="565.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">künftige Erklärung durch Elijahu</text><text x="482.5" y="593.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Zahlen ausschließlich in den Sachkarten</text><rect x="645.0" y="450.0" width="255.0" height="175.0" fill="#101515" stroke="#9EC2C7" stroke-width="1.8" rx="9"/><text x="772.5" y="498.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="19" text-anchor="middle">אַבַּרְבַּנְאֵל</text><text x="772.5" y="528.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Abarbanel</text><text x="772.5" y="565.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Zweck und Zukunftsbezug · teilgeprüft</text><text x="772.5" y="593.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Zahlen ausschließlich in den Sachkarten</text><rect x="935.0" y="450.0" width="255.0" height="175.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1.8" rx="9"/><text x="1062.0" y="493.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="19" text-anchor="middle">רַמְבַּ״ם</text><text x="1062.0" y="527.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Rahmenaussage</text><text x="1062.0" y="563.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">künftiger Bau nicht vollständig erklärt</text><text x="1062.0" y="593.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Grenze für jede Modellplatte</text><rect x="65.0" y="700.0" width="1125.0" height="105.0" fill="#0B0E0E" stroke="#C96B62" stroke-width="1.5" stroke-dasharray="7 6"/><text x="627.0" y="742.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Die Platten bezeichnen Methoden und Kommentartraditionen, keine räumlichen Bauteile.</text><text x="627.0" y="775.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Autorschaft von Text, Edition, Zeichnung und späterem Planblatt wird nicht pauschal gleichgesetzt.</text><line x1="46.0" y1="946.0" x2="1194.0" y2="946.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="954.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="962.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Leitmodell — Projektentscheidung, kein Abschlussplan</text><rect x="46.0" y="972.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="980.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Plantradition — Kommentar oder eigenes Planwerk</text><rect x="46.0" y="990.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="998.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Grenze — erklärtes Nichtwissen / Rambams Rahmen</text><text x="645.0" y="960.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="978.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· ein verschmolzener Gesamtplan</text><text x="645.0" y="994.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Übertragung fremder Zahlen</text><text x="645.0" y="1010.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· pauschale Plan-Autorschaft</text><text x="645.0" y="1026.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· abschließende Zukunftshalacha</text><text x="620.0" y="1058.0" fill="#6F746D" font-family="EB Garamond, 