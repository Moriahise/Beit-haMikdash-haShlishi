<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Hervortretendes Holz — die Reichweitenfrage</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 39 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">עֵץ בּוֹלֵט — מַחֲלֹקֶת הַגְּבוּל</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Hervortretendes Holz — die Reichweitenfrage</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Geltungsbereiche · ohne Maßstab · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polyline points="722.9,432.4 517.1,590.4 517.1,577.6" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="517.1" y="606.4" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Auslegung getrennt</text><polygon points="361.7,302.7 676.1,425.7 517.1,547.7 202.7,424.7" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="393.5,361.2 550.7,422.7 485.3,473.0 328.1,411.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="485.3,481.1 328.1,419.6 328.1,411.5 485.3,473.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="550.7,430.8 485.3,481.1 485.3,473.0 550.7,422.7" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="517.1,552.4 202.7,429.4 202.7,424.7 517.1,547.7" fill="#B8925D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="676.1,430.4 517.1,552.4 517.1,547.7 676.1,425.7" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="741.6,451.3 1056.0,574.3 897.0,696.3 582.6,573.3" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="766.9,507.3 937.2,573.9 871.7,624.2 701.4,557.6" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="871.7,632.3 701.4,565.6 701.4,557.6 871.7,624.2" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="937.2,582.0 871.7,632.3 871.7,624.2 937.2,573.9" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="897.0,701.0 582.6,578.0 582.6,573.3 897.0,696.3" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="1056.0,579.0 897.0,701.0 897.0,696.3 1056.0,574.3" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><text x="439.4" y="418.5" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Rambam · Holzverbot umfassend</text><text x="819.3" y="567.1" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Raavad · eingeschränkter Bereich</text><text x="439.4" y="410.4" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Reichweite umfassend</text><text x="819.3" y="559.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Nikanor-Bezug · getrennt</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Die zwei Höfe sind Geltungsdiagramme, keine maßstäblichen Grundrisse.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Rambam und Raavad bleiben eigenständige Rechtsmodelle.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Ein hervortretendes Holzelement wird nur als Begriff markiert.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — Geltungsbereiche · ohne Maßstab</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Holzquerschnitte</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Hofabmessungen</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mischung beider Modelle</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· konkretes Tragwerk</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Etz Bolet · Reichweitenvergleich zweier Auslegungen</text></svg>