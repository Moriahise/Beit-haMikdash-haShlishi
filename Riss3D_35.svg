<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Ramchal, der Gra und die Ausleger Jechezkels</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 35 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">רַמְחַ״ל, הַגְּרָ״א וּמְפָרְשֵׁי יְחֶזְקֵאל</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Ramchal, der Gra und die Ausleger Jechezkels</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Quellenmodelle · ohne Maßstab · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polygon points="387.5,281.1 521.6,333.6 443.3,393.7 309.2,341.2" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="521.6,347.3 443.3,407.5 443.3,393.7 521.6,333.6" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="443.3,407.5 309.2,355.0 309.2,341.2 443.3,393.7" fill="#B8925D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="558.1,357.3 692.2,409.7 613.9,469.8 479.8,417.4" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="278.8,374.0 412.8,426.4 334.5,486.6 200.5,434.1" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="692.2,414.1 613.9,474.2 613.9,469.8 692.2,409.7" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="613.9,474.2 479.8,421.8 479.8,417.4 613.9,469.8" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="412.8,430.8 334.5,490.9 334.5,486.6 412.8,426.4" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="334.5,490.9 200.5,438.5 200.5,434.1 334.5,486.6" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="728.8,424.0 862.8,476.5 784.5,536.6 650.5,484.1" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="449.4,440.8 583.4,493.2 505.1,553.3 371.1,500.9" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="862.8,480.9 784.5,541.0 784.5,536.6 862.8,476.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="784.5,541.0 650.5,488.5 650.5,484.1 784.5,536.6" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="583.4,497.6 505.1,557.7 505.1,553.3 583.4,493.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="505.1,557.7 371.1,505.2 371.1,500.9 505.1,553.3" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="899.4,490.8 1033.4,543.2 955.1,603.3 821.1,550.9" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="620.0,507.5 754.1,560.0 675.8,620.1 541.7,567.6" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="1033.4,547.6 955.1,607.7 955.1,603.3 1033.4,543.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="955.1,607.7 821.1,555.3 821.1,550.9 955.1,603.3" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="754.1,564.3 675.8,624.4 675.8,620.1 754.1,560.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="675.8,624.4 541.7,572.0 541.7,567.6 675.8,620.1" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><text x="415.4" y="331.1" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Rambam · eigenes Modell</text><text x="586.0" y="407.3" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Raschi · eigenes Modell</text><text x="756.6" y="474.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Radak · eigenes Modell</text><text x="927.3" y="540.8" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Gra · eigenes Modell</text><text x="306.6" y="424.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Ramchal · eigenes Modell</text><text x="477.3" y="490.8" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Malbim · eigenes Modell</text><text x="647.9" y="557.5" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Weitere Lesart · eigenes Modell</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Jede Platte steht für ein eigenständiges Auslegungsmodell.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gleiche Plattengröße bedeutet ausdrücklich keine Maßgleichheit.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Nur Aussagen derselben Quelle werden innerhalb eines Modells verbunden.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — Quellenmodelle · ohne Maßstab</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mischmodell</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· gemeinsamer Maßstab</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· erfundene Anschlussmaße</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· räumliche Rangfolge</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Auslegermodelle · sieben getrennte Lesarten</text></svg>