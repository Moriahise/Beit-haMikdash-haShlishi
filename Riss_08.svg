t-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — Achse oder Maß in der Karte strittig oder offen</text><rect x="46.0" y="790.0" width="16.0" height="9.0" fill="#6E9EAA" opacity=".85"/><text x="70.0" y="798.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">eigene Ebene — andere Quellenschicht</text><text x="645.0" y="760.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="778.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Begehbarer Chajl-Streifen (bis zu seinem Ende; Breite offen)</text><text x="620.0" y="858.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Höhenschema · Einheiten getrennt · keine Umrechnung · kein Zukunftsbauplan</text></svg>