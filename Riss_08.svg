<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Höhenschema — Soreg und Chajl — zwei Schwellen, eine offene Achsenfrage</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="880.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 08 · Höhenschema</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25" direction="rtl">סוֹרֵג וְחֵיל</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Soreg und Chajl — zwei Schwellen, eine offene Achsenfrage</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Höhen in der Einheit der Quelle · Tefachim und Ammot nicht ineinander umgerechnet</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><line x1="80.0" y1="640.0" x2="1160.0" y2="640.0" stroke="#B8925D" stroke-width="2"/><text x="80.0" y="630.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">Bodenlinie · Bezug der Karte</text><rect x="150.0" y="380.0" width="120.0" height="260.0" fill="#101515" stroke="url(#rWall)" stroke-width="3"/><line x1="136.0" y1="380.0" x2="136.0" y2="640.0" stroke="#D7BD87" stroke-width="1"/><line x1="132.0" y1="380.0" x2="140.0" y2="380.0" stroke="#D7BD87" stroke-width="1"/><line x1="132.0" y1="640.0" x2="140.0" y2="640.0" stroke="#D7BD87" stroke-width="1"/><text x="128.0" y="510.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle" transform="rotate(-90 128.0 510.0)">10 Tefachim</text><text x="210.0" y="662.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Soreg, Höhe</text><text x="210.0" y="678.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Middot 2:3; Rambam BhB 5 [ג]</text><line x1="345.0" y1="220.0" x2="345.0" y2="650.0" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="333.0" y="430.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 333.0 430.0)">getrennte Einheiten · Höhen nicht vergleichbar</text><rect x="420.0" y="380.0" width="120.0" height="260.0" fill="#101515" stroke="#C96B62" stroke-width="3" stroke-dasharray="6 4"/><line x1="406.0" y1="380.0" x2="406.0" y2="640.0" stroke="#D7A09A" stroke-width="1"/><line x1="402.0" y1="380.0" x2="410.0" y2="380.0" stroke="#D7A09A" stroke-width="1"/><line x1="402.0" y1="640.0" x2="410.0" y2="640.0" stroke="#D7A09A" stroke-width="1"/><text x="398.0" y="510.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle" transform="rotate(-90 398.0 510.0)">10 Amot</text><text x="480.0" y="662.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Chajl</text><text x="480.0" y="678.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Middot 2:3; Rambam BhB 5 [ג]</text><text x="560.0" y="364.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11">Achse strittig: der Wortlaut sagt „hoch“</text><rect x="560.0" y="600.0" width="260.0" height="40.0" fill="none" stroke="#C96B62" stroke-width="2" stroke-dasharray="5 5"/><line x1="560.0" y1="592.0" x2="820.0" y2="592.0" stroke="#D7A09A" stroke-width="1"/><line x1="560.0" y1="588.0" x2="560.0" y2="596.0" stroke="#D7A09A" stroke-width="1"/><line x1="820.0" y1="588.0" x2="820.0" y2="596.0" stroke="#D7A09A" stroke-width="1"/><text x="690.0" y="585.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">10 Amot als Breite gelesen</text><text x="560.0" y="658.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Beide Lesungen stehen nebeneinander; die Karte entscheidet nicht.</text><text x="150.0" y="250.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Breschen im Soreg · 13 Stück · Middot 2:3</text><line x1="150.0" y1="280.0" x2="410.0" y2="280.0" stroke="#D7BD87" stroke-width="2"/><line x1="160.0" y1="272.0" x2="160.0" y2="288.0" stroke="#0B0E0E" stroke-width="4"/><line x1="160.0" y1="272.0" x2="160.0" y2="288.0" stroke="#C96B62" stroke-width="1.5"/><line x1="180.0" y1="272.0" x2="180.0" y2="288.0" stroke="#0B0E0E" stroke-width="4"/><line x1="180.0" y1="272.0" x2="180.0" y2="288.0" stroke="#C96B62" stroke-width="1.5"/><line x1="200.0" y1="272.0" x2="200.0" y2="288.0" stroke="#0B0E0E" stroke-width="4"/><line x1="200.0" y1="272.0" x2="200.0" y2="288.0" stroke="#C96B62" stroke-width="1.5"/><line x1="220.0" y1="272.0" x2="220.0" y2="288.0" stroke="#0B0E0E" stroke-width="4"/><line x1="220.0" y1="272.0" x2="220.0" y2="288.0" stroke="#C96B62" stroke-width="1.5"/><line x1="240.0" y1="272.0" x2="240.0" y2="288.0" stroke="#0B0E0E" stroke-width="4"/><line x1="240.0" y1="272.0" x2="240.0" y2="288.0" stroke="#C96B62" stroke-width=