<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Verortungsschema — </title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="860.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte ?? · Verortungsschema</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25" direction="rtl">בֵּית הַמִּקְדָּשׁ הַשְּׁלִישִׁי</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic"></text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Ordnungsdarstellung · kein Maßstab</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><rect x="160.0" y="230.0" width="620.0" height="480.0" fill="none" stroke="#B8925D" stroke-width="1.5" stroke-dasharray="8 7" rx="14"/><text x="470.0" y="256.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="17" text-anchor="middle" direction="rtl"></text><text x="470.0" y="276.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="12" text-anchor="middle" font-style="italic">Jerusalem</text><rect x="260.0" y="310.0" width="420.0" height="320.0" fill="none" stroke="#B8925D" stroke-width="1.5" stroke-dasharray="8 7" rx="14"/><text x="470.0" y="336.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="17" text-anchor="middle" direction="rtl"></text><text x="470.0" y="356.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="12" text-anchor="middle" font-style="italic">Har HaMoriah</text><rect x="355.0" y="385.0" width="230.0" height="170.0" fill="#101515" stroke="#D7BD87" stroke-width="3" rx="14"/><text x="470.0" y="411.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="20" text-anchor="middle" direction="rtl"></text><text x="470.0" y="431.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="12" text-anchor="middle" font-style="italic">Der Mikdasch</text><text x="470.0" y="490.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="14" text-anchor="middle">Ortsbindung belegt</text><text x="470.0" y="512.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="14" text-anchor="middle">Maß und Punkt nicht</text><text x="900.0" y="250.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13">Was diese Karte festlegt</text><text x="900.0" y="280.0" fill="#D5C6AA" font-family="EB Garamond, Georgia, serif" font-size="11">· Der Ort ist gebunden: Jerusalem und Har HaMoriah.</text><text x="900.0" y="314.0" fill="#D5C6AA" font-family="EB Garamond, Georgia, serif" font-size="11">· Die Bindung ist halachisch, nicht topographisch vermessen.</text><text x="900.0" y="348.0" fill="#D5C6AA" font-family="EB Garamond, Georgia, serif" font-size="11">· Die Schachtelung der Bezirke ist eine Ordnung, keine Fläche.</text><text x="900.0" y="420.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="13">Was sie ausdrücklich offenlässt</text><text x="900.0" y="450.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Keine Maßzahl, keine Kantenlänge.</text><text x="900.0" y="484.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Keine moderne Koordinate, kein GPS-Punkt.</text><text x="900.0" y="518.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Keine Zuordnung zu einem heutigen Bauwerk.</text><rect x="900.0" y="560.0" width="260.0" height="46.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1"/><text x="1030.0" y="588.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">kein Maßstab anwendbar</text><line x1="46.0" y1="726.0" x2="1194.0" y2="726.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="734.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="742.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — Bezirk belegt, Ausdehnung nicht angegeben</text><rect x="46.0" y="752.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="760.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">durchgezogen — Gegenstand der Karte</text><rect x="46.0" y="770.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="778.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">schraffiert — ausdrücklich offen</text><text x="645.0" y="740.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="758.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Kantenlängen und Flächen</text><text x="645.0" y="774.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· moderne Koordinaten</text><text x="645.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Lage im heutigen Stadtbild</text><text x="620.0" y="838.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Verortung · Ordnung der Bezirke · keine Fläche, kein Punkt</text></svg>