<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Chiskijahus Wasserwerk</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 26 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">נִקְבַּת חִזְקִיָּהוּ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Chiskijahus Wasserwerk</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · ohne Maßstab · Quellenmatrix · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polyline points="735.2,418.7 504.8,595.6 504.8,591.3" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="504.8" y="611.6" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Quellen nicht addiert</text><polygon points="400.5,283.4 687.4,395.7 593.5,467.8 306.6,355.5" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="593.5,472.1 306.6,359.8 306.6,355.5 593.5,467.8" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="687.4,400.0 593.5,472.1 593.5,467.8 687.4,395.7" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="263.9,388.3 550.8,500.5 456.9,572.6 170.0,460.3" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="456.9,576.9 170.0,464.6 170.0,460.3 456.9,572.6" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="783.1,433.1 1070.0,545.4 976.1,617.4 689.2,505.2" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="550.8,504.8 456.9,576.9 456.9,572.6 550.8,500.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="976.1,621.7 689.2,509.5 689.2,505.2 976.1,617.4" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="1070.0,549.7 976.1,621.7 976.1,617.4 1070.0,545.4" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="646.5,537.9 933.4,650.2 839.5,722.3 552.6,610.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="839.5,726.6 552.6,614.3 552.6,610.0 839.5,722.3" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="933.4,654.5 839.5,726.6 839.5,722.3 933.4,650.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><text x="497.0" y="369.4" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">II Melachim · Becken und Leitung</text><text x="879.6" y="519.1" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">II Divrei HaJamim · abwärts / westwärts</text><text x="360.4" y="474.3" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Jeschajahu 22 · eigener Zeitzeuge</text><text x="743.0" y="624.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">D-Schicht · 805–795 v. d. Z.</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Vier Platten bilden eine Quellenmatrix und keinen technischen Leitungsverlauf.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Melachim und Divrei HaJamim nennen verschiedene Handlungen und Objekte.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Der archäologische Befund bleibt datiert, separat und ohne Ammah-Schluss.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — ohne Maßstab · Quellenmatrix</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Tanachplatte — Textaussage</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offene Platte — Zusammenhang oder Identifikation offen</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">ohne Maßstab — keine Distanz oder Höhe</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Leitungslänge und Querschnitt</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Verbindung aller Objekte</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Ammah-Umrechnung</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Jechezkel-47-Strom</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Quellenmatrix · räumlich getrennt, nicht als Leitung rekonstruiert</text></svg>