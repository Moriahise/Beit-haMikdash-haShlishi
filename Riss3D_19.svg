<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Die Hauswand — 6 Amot</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 19 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">כֹּתֶל הַבַּיִת — 6 אַמּוֹת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die Hauswand — 6 Amot</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Ammot · getrennte Register · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polyline points="515.1,413.7 349.0,541.2 349.0,449.2" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="349.0" y="557.2" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">anderer Bauteiltyp</text><polyline points="712.0,490.7 545.9,618.3 545.9,526.3" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="545.9" y="634.3" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">anderer Bauteiltyp</text><polyline points="891.0,560.8 724.9,688.3 724.9,596.3" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="724.9" y="704.3" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">anderer Bauteiltyp</text><polygon points="323.3,353.5 484.4,416.5 369.4,504.8 208.3,441.8" fill="#101515" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="418.0,405.3 328.5,474.0 328.5,382.0 418.0,313.3" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="484.4,420.2 369.4,508.5 369.4,504.8 484.4,416.5" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="364.3,292.3 418.0,313.3 328.5,382.0 274.8,361.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="369.4,508.5 208.3,445.4 208.3,441.8 369.4,504.8" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="328.5,474.0 274.8,453.0 274.8,361.0 328.5,382.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="520.2,430.5 681.3,493.5 566.3,581.8 405.2,518.8" fill="#101515" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="589.3,502.0 551.0,531.4 551.0,476.2 589.3,446.8" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="535.6,425.8 589.3,446.8 551.0,476.2 497.3,455.2" fill="#D7BD87" f