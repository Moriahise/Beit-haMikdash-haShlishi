<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Even HaSchtijah — innerer Referenzpunkt</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 02 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25" direction="rtl">אֶבֶן הַשְּׁתִיָּה — צִיר הַבַּיִת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Even HaSchtijah — innerer Referenzpunkt</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Maßstab in Einheit der Quelle · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><line x1="496.6" y1="314.9" x2="195.9" y2="545.8" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="601.9" y1="356.1" x2="301.2" y2="587.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="707.2" y1="397.3" x2="406.5" y2="628.2" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="812.5" y1="438.5" x2="511.8" y2="669.4" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="917.8" y1="479.7" x2="617.1" y2="710.6" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="1023.1" y1="520.9" x2="722.4" y2="751.8" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="496.6" y1="314.9" x2="1044.1" y2="529.2" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="421.4" y1="372.6" x2="969.0" y2="586.9" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="346.2" y1="430.4" x2="893.8" y2="644.6" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="271.0" y1="488.1" x2="818.6" y2="702.3" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="195.9" y1="545.8" x2="743.4" y2="760.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><polygon points="496.6,314.9 791.4,430.3 707.2,494.9 412.4,379.6" fill="#101515" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="738.8,470.7 443.9,355.3 443.9,290.4 738.8,405.8" fill="#B8925D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="465.0,274.2 759.8,389.6 738.8,405.8 443.9,290.4" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="707.2,505.7 412.4,390.4 412.4,379.6 707.2,494.9" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="791.4,441.1 707.2,505.7 707.2,494.9 791.4,430.3" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="759.8,454.5 738.8,470.7 738.8,405.8 759.8,389.6" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><text x="601.9" y="318.3" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Höhe der Oberfläche · 3 Etzba’ot</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Die Körper stehen in verschiedenen Einheiten und sind untereinander nicht vergleichbar.</text><line x1="46" y1="756" x2="159.07490748313302" y2="756" stroke="#D7BD87" stroke-width="3"/><text x="169.1" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">5 Einheit der Quelle (in der Bodenebene)</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Lage des Steins (keine Maßzahl)</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Grundfläche des Steins</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Axonometrie · relative Lage · keine Perspektive, kein Bildwerk · kein Zukunftsbauplan</text></svg>