<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Der heilige Bezirk in Jechezkel 45</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 06 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">תְּרוּמַת הַקֹּדֶשׁ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Der heilige Bezirk in Jechezkel 45</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Großzahlen ohne Einheit · Heiligtum eigene Skala · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polyline points="758.6,391.8 436.2,639.3 436.2,600.6" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="436.2" y="655.3" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Skalen nicht gleichsetzen</text><polygon points="495.2,284.0 683.4,357.7 575.9,440.2 387.7,366.5" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="683.4,362.3 575.9,444.8 575.9,440.2 683.4,357.7" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="575.9,444.8 387.7,371.2 387.7,366.5 575.9,440.2" fill="#B8925D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="387.7,366.5 575.9,440.2 468.4,522.7 280.2,449.0" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="575.9,444.8 468.4,527.3 468.4,522.7 575.9,440.2" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="468.4,527.3 280.2,453.7 280.2,449.0 468.4,522.7" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="280.2,449.0 468.4,522.7 414.7,563.9 226.5,490.3" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="786.6,440.1 967.3,510.7 838.3,609.7 657.6,539.1" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="790.9,449.6 941.5,508.5 834.0,591.0 683.4,532.1" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="414.7,568.6 226.5,494.9 226.5,490.3 414.7,563.9" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="468.4,527.3 414.7,568.6 414.7,563.9 468.4,522.7" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="941.5,513.1 834.0,595.6 834.0,591.0 941.5,508.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="967.3,512.3 838.3,611.3 838.3,609.7 967.3,510.7" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="834.0,595.6 683.4,536.7 683.4,532.1 834.0,591.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="838.3,611.3 657.6,540.6 657.6,539.1 838.3,609.7" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="629.7,539.3 780.2,598.2 705.0,655.9 554.5,597.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="705.0,694.6 554.5,635.7 554.5,597.0 705.0,655.9" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="780.2,636.9 705.0,694.6 705.0,655.9 780.2,598.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><text x="535.5" y="354.4" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Priester · 25.000 × 10.000 · Einheit offen</text><text x="428.1" y="436.9" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Leviten · 25.000 × 10.000 · Einheit offen</text><text x="347.5" y="498.7" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Stadt · 25.000 × 5.000 · Einheit offen</text><text x="812.4" y="512.5" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Heiligtum · 500 × 500 · Einheit offen</text><text x="812.4" y="517.2" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Migrasch 50 Ammah · eigene Skala</text><text x="667.4" y="589.9" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Mikdasch-Gebäude · Maße offen</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Die drei Landstreifen sind nur nach ihren Zahlen 10.000 : 10.000 : 5.000 proportioniert.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Das 500 × 500-Heiligtumsquadrat steht in einer eigenen, nicht gleichgesetzten Skala.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Nur der ringsseitige Migrasch nennt ausdrücklich 50 Ammah.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — Großzahlen ohne Einheit · Heiligtum eigene Skala</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Einheit der Großzahlen</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Einheit des 500er-Quadrats</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mikdasch-Gebäudemaße</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· moderne Landkoordinaten</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Terumah · Landordnung proportional innerhalb der Ebene · Skalen getrennt</text></svg>