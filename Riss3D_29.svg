<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Jechezkel 47 — Wasser unter der Schwelle</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 29 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">מַיִם מִתַּחַת מִפְתַּן הַבַּיִת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Jechezkel 47 — Wasser unter der Schwelle</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · ohne Maßstab · relative Richtung · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polygon points="349.1,323.8 555.7,404.6 429.3,501.7 222.7,420.9" fill="#101515" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="555.7,410.0 429.3,507.0 429.3,501.7 555.7,404.6" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="511.4,432.0 526.2,437.7 473.5,478.2 458.7,472.4" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="526.2,441.1 473.5,481.6 473.5,478.2 526.2,437.7" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="429.3,507.0 222.7,426.2 222.7,420.9 429.3,501.7" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="473.5,481.6 458.7,475.8 458.7,472.4 473.5,478.2" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="271.2,438.4 359.7,473.0 328.1,497.3 239.6,462.7" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="328.1,516.3 239.6,481.6 239.6,462.7 328.1,497.3" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="359.7,492.0 328.1,516.3 328.1,497.3 359.7,473.0" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="510.4,450.2 864.5,588.8 843.5,605.0 489.3,466.4" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="843.5,607.2 489.3,468.7 489.3,466.4 843.5,605.0" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="864.5,591.1 843.5,607.2 843.5,605.0 864.5,588.8" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="914.0,557.1 1002.6,591.7 897.2,672.6 808.7,637.9" fill="#F2EAD9" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="1002.6,597.0 897.2,677.9 897.2,672.6 1002.6,591.7" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="897.2,677.9 808.7,643.2 808.7,637.9 897.2,672.6" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><text x="389.2" y="405.2" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Das Haus · Front nach Osten</text><text x="492.5" y="447.5" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Schwelle · Form offen</text><text x="676.9" y="520.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Wasser ostwärts · Breite/Tiefe offen</text><text x="299.6" y="460.3" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Mizbeach · nur südlicher Lageanker</text><text x="905.6" y="607.2" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">äußeres Osttor · zweiter Blickpunkt</text><text x="766.0" y="402.4" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">NORD</text><text x="1040.8" y="679.1" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">OST</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Der Wasserstreifen bezeichnet ausschließlich Austritt und Fließrichtung; seine gezeichnete Breite ist kein Maß.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Der Mizbeach dient nur als Lageanker südlich der rechten Hausschulter.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Der Beobachterweg über Nordtor und Außenseite wird im 2D-Riss geführt, nicht als Wasserleitung.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — ohne Maßstab · relative Richtung</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Öffnung, Fuge, Rinne oder Rohr</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Menge, Breite und Tiefe</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gefälle</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· hydraulische Verbindung zum Wassertor</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Wasser unter der Schwelle · relative Axonometrie ohne Hydraulik</text></svg>