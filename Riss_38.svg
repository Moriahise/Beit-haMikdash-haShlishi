<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1080" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Steinordnung · Material- und Bearbeitungsweg — Große Steine, Ziegel und Bearbeitung außerhalb</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1080.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 38 · Steinordnung · Material- und Bearbeitungsweg</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">אֲבָנִים גְּדוֹלוֹת וְסִתּוּת מִבַּחוּץ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Große Steine, Ziegel und Bearbeitung außerhalb</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Keine Maßzahl · Pflicht, Alternative, Bearbeitungsort und Abgrenzung</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="166.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1">MATERIALWAHL UND BEARBEITUNGSWEG · KEINE STEINFORMATE</text><rect x="70.0" y="230.0" width="270.0" height="105.0" fill="#101515" stroke="#D7BD87" stroke-width="1.8" rx="8"/><text x="205.0" y="266.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">GROSSE, GANZE STEINE</text><text x="205.0" y="295.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Pflicht · Größe/Toleranz offen</text><rect x="70.0" y="385.0" width="270.0" height="105.0" fill="#101515" stroke="#9EC2C7" stroke-width="1.8" stroke-dasharray="6 5" rx="8"/><text x="205.0" y="421.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">ZIEGEL</text><text x="205.0" y="450.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Alternative nur bei fehlenden Steinen</text><line x1="340.0" y1="282.0" x2="445.0" y2="282.0" stroke="#D7BD87" stroke-width="3"/><line x1="340.0" y1="437.0" x2="405.0" y2="437.0" stroke="#9EC2C7" stroke-width="2" stroke-dasharray="6 5"/><line x1="405.0" y1="437.0" x2="445.0" y2="282.0" stroke="#9EC2C7" stroke-width="2" stroke-dasharray="6 5"/><rect x="445.0" y="230.0" width="300.0" height="145.0" fill="#101515" stroke="#CFB36D" stroke-width="1.8" rx="8"/><text x="595.0" y="266.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">BEARBEITUNG AUSSERHALB</text><text x="595.0" y="295.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">spalten und glätten · Distanz offen</text><text x="595.0" y="342.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Eisenwerkzeug nur im Kommentar ausdrücklich</text><line x1="745.0" y1="302.0" x2="850.0" y2="302.0" stroke="#CFB36D" stroke-width="3"/><path d="M850 302 l-14 -7 l4 14 z" fill="#CFB36D"/><rect x="850.0" y="230.0" width="320.0" height="145.0" fill="#101515" stroke="#D7BD87" stroke-width="1.8" rx="8"/><text x="1010.0" y="266.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">EINBRINGEN IN HEICHAL / ASARAH</text><text x="1010.0" y="295.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">fertige, zweckgebundene Bauteile</text><rect x="70.0" y="570.0" width="330.0" height="120.0" fill="#101515" stroke="#D7A09A" stroke-width="1.8" stroke-dasharray="6 5" rx="8"/><text x="235.0" y="606.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">BESCHÄDIGTER STEIN</text><text x="235.0" y="635.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">untauglich · verwahren · nicht auslösen</text><rect x="455.0" y="570.0" width="330.0" height="120.0" fill="#101515" stroke="#D7A09A" stroke-width="1.8" stroke-dasharray="6 5" rx="8"/><text x="620.0" y="606.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">FREMDE ZWECKBINDUNG</text><text x="620.0" y="635.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">für Synagoge gebrochen → hier nicht verbauen</text><rect x="840.0" y="570.0" width="330.0" height="120.0" fill="#101515" stroke="#9EC2C7" stroke-width="1.8" rx="8"/><text x="1005.0" y="606.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">MIZBEACH / KEWESCH</text><text x="1005.0" y="635.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Eisenkontakt-Verbot · eigene begrenzte Regel</text><line x1="420.0" y1="540.0" x2="420.0" y2="720.0" stroke="#C96B62" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="805.0" y1="540.0" x2="805.0" y2="720.0" stroke="#C96B62" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="70.0" y="760.0" width="1100.0" height="82.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1.4"/><text x="620.0" y="793.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">Nicht verallgemeinern</text><text x="620.0" y="819.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Mizbeach-Herkunfts- und Eisenregeln werden nicht auf alle Haussteine übertragen.</text><line x1="46.0" y1="946.0" x2="1194.0" y2="946.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="954.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="962.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Pflichtweg — große ganze Steine · außen bearbeiten</text><rect x="46.0" y="972.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="980.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Alternative/Abgrenzung — Ziegel oder eigene Mizbeach-Regel</text><rect x="46.0" y="990.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="998.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">untauglich — beschädigt oder fremd zweckgebunden</text><text x="645.0" y="960.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="978.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Steinformat und Toleranzmaß</text><text x="645.0" y="994.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Distanz des Bearbeitungsorts</text><text x="645.0" y="1010.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Werkzeugsatz im Grundtext</text><text x="645.0" y="1026.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Übertragung der Mizbeach-Regeln</text><text x="620.0" y="1058.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Bauhalacha als Ablauf- und Geltungsschema · kein Mauerverband</text></svg>