<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 950" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Wasserwerk · Quellenmatrix — Chiskijahus Wasserwerk</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="950.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 26 · Wasserwerk · Quellenmatrix</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">נִקְבַּת חִזְקִיָּהוּ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Chiskijahus Wasserwerk</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Keine Tanach-Maßzahl · Befundwerte nur in eigener D-Schicht</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="175.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1.1">ZWEI HAUPTTEXTE · KEIN VERSCHMOLZENES TECHNIKPROFIL</text><rect x="90.0" y="220.0" width="500.0" height="245.0" fill="#101515" stroke="#9EC2C7" stroke-width="2" rx="10"/><text x="112.0" y="254.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="13">II MELACHIM 20:20</text><text x="112.0" y="288.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11">· Becken und Leitung</text><text x="112.0" y="315.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Ergebnis: Wasser in der Stadt</text><text x="112.0" y="342.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· keine Richtung · keine Zahl · kein Querschnitt</text><rect x="650.0" y="220.0" width="500.0" height="245.0" fill="#101515" stroke="#CFB36D" stroke-width="2" rx="10"/><text x="672.0" y="254.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="13">II DIVREI HAJAMIM 32:30</text><text x="672.0" y="288.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11">· Verschluss und Umleitung des Gihon</text><text x="672.0" y="315.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Richtung: abwärts und westwärts</text><text x="672.0" y="342.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· keine Zahl · kein technisches Profil</text><line x1="620.0" y1="205.0" x2="620.0" y2="485.0" stroke="#C96B62" stroke-width="2" stroke-dasharray="7 6"/><text x="606.0" y="345.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 606.0 345.0)">zwei Aussagen · nicht zu einem Bauplan addiert</text><rect x="90.0" y="525.0" width="500.0" height="170.0" fill="#101515" stroke="#D7BD87" stroke-width="2" rx="10"/><text x="112.0" y="559.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13">JESCHAJAHU 22:9–11 · EIGENER ZEITZEUGE</text><text x="112.0" y="593.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11">· Unteres Becken und Sammelbecken</text><text x="112.0" y="620.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Zusammenhang mit den Hauptstellen offen</text><rect x="650.0" y="525.0" width="500.0" height="170.0" fill="#101515" stroke="#6E9EAA" stroke-width="2" rx="10"/><text x="672.0" y="559.0" fill="#6E9EAA" font-family="EB Garamond, Georgia, serif" font-size="13">D · ARCHÄOLOGISCHE BEFUNDGRUPPE</text><text x="672.0" y="593.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11">· Schiloach-Damm: 805–795 v. d. Z. · Stand 2025</text><text x="672.0" y="620.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· älter als die übliche Chiskijahu-Datierung</text><text x="672.0" y="647.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· kein Schluss auf eine Ammah-Länge</text><line x1="620.0" y1="510.0" x2="620.0" y2="715.0" stroke="#C96B62" stroke-width="2" stroke-dasharray="7 6"/><text x="90.0" y="725.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="12" letter-spacing="1">ARCHÄOLOGIE BLEIBT VOM TANACH-MAẞREGISTER GETRENNT</text><rect x="90.0" y="748.0" width="1060.0" height="48.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1.5"/><text x="620.0" y="778.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">keine Meterzahl → keine Amot · keine Identifikation → kein Leitungsverlauf</text><line x1="46.0" y1="816.0" x2="1194.0" y2="816.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="824.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="832.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Melachim — Becken und Leitung</text><rect x="46.0" y="842.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="850.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Divrei HaJamim — Verschluss und relative Richtung</text><rect x="46.0" y="860.0" width="16.0" height="9.0" fill="#6E9EAA" opacity=".85"/><text x="70.0" y="868.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">D-Schicht — archäologisch, datiert, nicht normativ</text><text x="645.0" y="830.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="848.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Länge und Querschnitt der Leitung</text><text x="645.0" y="864.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· technische Verbindung aller Objekte</text><text x="645.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Ammah-Umrechnung</text><text x="645.0" y="896.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Zukunftsstrom aus Jechezkel 47</text><text x="620.0" y="928.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Quellenmatrix · Textaussagen und Befund getrennt · kein technischer Bauplan</text></svg>