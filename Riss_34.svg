<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1110" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Stadt und Migrasch · Zahlenfigur — Stadt und Freifläche in Jechezkel</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1110.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 34 · Stadt und Migrasch · Zahlenfigur</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">הָעִיר וְהַמִּגְרָשׁ בִּיחֶזְקֵאל</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Stadt und Freifläche in Jechezkel</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Verszahlen ohne genanntes Einheitswort · Kommentarvarianten getrennt</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="166.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1">STADTFIGUR · ZAHLEN BELEGT, EINHEIT IM VERS NICHT GENANNT</text><rect x="370.0" y="210.0" width="400.0" height="400.0" fill="url(#rHatchQ)" stroke="#9EC2C7" stroke-width="2"/><rect x="390.0" y="230.0" width="360.0" height="360.0" fill="#101515" stroke="#D7BD87" stroke-width="4"/><text x="570.0" y="404.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="28" text-anchor="middle">הָעִיר</text><text x="570.0" y="434.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">4.500 × 4.500 · Einheit offen</text><line x1="390.0" y1="182.0" x2="750.0" y2="182.0" stroke="#F2EAD9" stroke-width="1"/><line x1="390.0" y1="178.0" x2="390.0" y2="186.0" stroke="#F2EAD9" stroke-width="1"/><line x1="750.0" y1="178.0" x2="750.0" y2="186.0" stroke="#F2EAD9" stroke-width="1"/><text x="570.0" y="175.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">4.500 · Nordseite</text><line x1="342.0" y1="230.0" x2="342.0" y2="590.0" stroke="#F2EAD9" stroke-width="1"/><line x1="338.0" y1="230.0" x2="346.0" y2="230.0" stroke="#F2EAD9" stroke-width="1"/><line x1="338.0" y1="590.0" x2="346.0" y2="590.0" stroke="#F2EAD9" stroke-width="1"/><text x="334.0" y="410.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle" transform="rotate(-90 334.0 410.0)">4.500 · Westseite</text><text x="570.0" y="645.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Umfang 18.000 = vier Seiten · keine eigene Seitenlänge</text><text x="786.0" y="410.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11">Migrasch 250 je Seite</text><rect x="471.0" y="225.0" width="18.0" height="10.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="471.0" y="585.0" width="18.0" height="10.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="385.0" y="311.0" width="10.0" height="18.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="745.0" y="311.0" width="10.0" height="18.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="561.0" y="225.0" width="18.0" height="10.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="561.0" y="585.0" width="18.0" height="10.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="385.0" y="401.0" width="10.0" height="18.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="745.0" y="401.0" width="10.0" height="18.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="651.0" y="225.0" width="18.0" height="10.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="651.0" y="585.0" width="18.0" height="10.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="385.0" y="491.0" width="10.0" height="18.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><rect x="745.0" y="491.0" width="10.0" height="18.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.4"/><text x="838.0" y="265.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="12">12 Tore</text><text x="838.0" y="288.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10">3 je Seite · Öffnungsmaß offen</text><rect x="70.0" y="700.0" width="500.0" height="130.0" fill="#101515" stroke="#B8925D" stroke-width="1.5" rx="8"/><text x="95.0" y="733.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">VERBLEIBENDER STREIFEN</text><rect x="95.0" y="762.0" width="420.0" height="38.0" fill="#6E9EAA" stroke="#9EC2C7" stroke-width="1.2"/><text x="305.0" y="788.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">5.000 breit über 25.000 Länge · Einheit offen</text><text x="95.0" y="817.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="9">Kontextstreifen · nicht im Maßstab der Stadtfigur</text><rect x="625.0" y="700.0" width="545.0" height="130.0" fill="#101515" stroke="#C96B62" stroke-width="1.5" rx="8"/><text x="650.0" y="733.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11">KOMMENTARVARIANTEN · KEINE ENTSCHEIDUNG</text><text x="650.0" y="773.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12">Raschi: 4.500 / 18.000 als Kanim</text><text x="650.0" y="802.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12">Radak: 4.500 als Amot</text><line x1="895.0" y1="745.0" x2="895.0" y2="818.0" stroke="#C96B62" stroke-width="1.5" stroke-dasharray="5 5"/><text x="920.0" y="785.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10">Verswortlaut bleibt ohne Einheit</text><line x1="46.0" y1="976.0" x2="1194.0" y2="976.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="984.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="992.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Stadt — vier Seiten zu 4.500</text><rect x="46.0" y="1002.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="1010.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Migrasch — 250 je Richtung</text><rect x="46.0" y="1020.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="1028.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Tore — 12 · drei je Seite</text><text x="645.0" y="990.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="1008.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Entscheidung Kanim oder Amot</text><text x="645.0" y="1024.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Toröffnungsmaße</text><text x="645.0" y="1040.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gebäude und Straßen der Stadt</text><text x="645.0" y="1056.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Verschmelzung mit dem heiligen Landbezirk</text><text x="620.0" y="1088.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Jechezkel 48 · proportionale Zahlenfigur innerhalb der Versebene · Einheit offen</text></svg>