<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Die rabbinische Verbindung Schiloach–Mikdasch</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 28 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">הַקֶּשֶׁר בֵּין הַשִּׁלֹחַ לַמִּקְדָּשׁ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die rabbinische Verbindung Schiloach–Mikdasch</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · ohne Maßstab · relative Beziehung · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polyline points="807.5,450.3 582.6,623.0 582.6,618.4" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="582.6" y="639.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">keine Identität</text><polygon points="275.0,411.1 440.0,475.7 386.4,516.8 221.4,452.2" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="386.4,521.4 221.4,456.9 221.4,452.2 386.4,516.8" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="553.6,459.2 688.6,512.1 661.8,532.6 526.8,479.8" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="440.0,480.3 386.4,521.4 386.4,516.8 440.0,475.7" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="661.8,536.1 526.8,483.3 526.8,479.8 661.8,532.6" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="688.6,515.5 661.8,536.1 661.8,532.6 688.6,512.1" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="808.5,471.0 1018.6,553.1 975.7,586.0 765.7,503.8" fill="#F2EAD9" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="975.7,590.6 765.7,508.5 765.7,503.8 975.7,586.0" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="1018.6,557.8 975.7,590.6 975.7,586.0 1018.6,553.1" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="689.7,579.6 884.7,655.9 836.5,692.9 641.5,616.6" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="836.5,697.5 641.5,621.2 641.5,616.6 836.5,692.9" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="884.7,660.5 836.5,697.5 836.5,692.9 884.7,655.9" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><text x="330.7" y="456.3" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Schiloach · Ausgang im Süden</text><text x="607.7" y="488.2" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Weg nach Norden · Verlauf offen</text><text x="892.1" y="520.8" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Wassertor der Azarah · Südreihe nahe Westen</text><text x="763.1" y="628.5" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Wassertor der Stadtmauer · anderes Bauwerk</text><text x="768.4" y="393.4" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">NORD</text><text x="1038.6" y="671.1" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">OST</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Die Platten zeigen nur Ausgang, Ziel und die relative Bewegung von Süd nach Nord.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Die Zwischenplatte ist kein rekonstruierter Straßenverlauf und besitzt keine ablesbare Länge oder Breite.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Das Wassertor der Stadtmauer bleibt vom Wassertor der Azarah getrennt.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — ohne Maßstab · relative Beziehung</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Weglänge und -breite</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gefälle</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· exakter Verlauf</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· historische Straße als Norm</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Schiloach–Mikdasch · relative Topologie, keine Weggeometrie</text></svg>