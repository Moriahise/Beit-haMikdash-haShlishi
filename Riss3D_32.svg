<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Der Entwässerungskanal unter der Straße</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 32 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">תְּעָלַת הַנִּקּוּז תַּחַת הָרְחוֹב</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Der Entwässerungskanal unter der Straße</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Meter · je Abschnitt eigener Maßstab · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polyline points="572.0,420.0 366.5,577.7 366.5,472.1" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="366.5" y="593.7" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Abschnitt / System getrennt</text><polyline points="852.9,529.9 647.5,687.6 647.5,582.0" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="647.5" y="703.6" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Abschnitt / System getrennt</text><polygon points="489.8,387.8 391.9,462.9 391.9,357.3 489.8,282.2" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="407.5,250.0 489.8,282.2 391.9,357.3 309.7,325.1" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="391.9,462.9 309.7,430.7 309.7,325.1 391.9,357.3" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="599.4,388.4 832.4,479.6 783.4,517.2 550.5,426.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="255.9,468.5 420.3,532.9 386.1,559.2 221.6,494.8" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="783.4,559.4 550.5,468.3 550.5,426.0 783.4,517.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="386.1,562.7 221.6,498.3 221.6,494.8 386.1,559.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="832.4,521.9 783.4,559.4 783.4,517.2 832.4,479.6" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="420.3,536.4 386.1,562.7 386.1,559.2 420.3,532.9" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="887.2,501.0 1024.2,554.7 975.3,592.2 838.3,538.6" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="488.9,559.7 653.3,624.0 619.1,650.3 454.6,586.0" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="975.3,634.5 838.3,580.9 838.3,538.6 975.3,592.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="619.1,653.8 454.6,589.5 454.6,586.0 619.1,650.3" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="1024.2,596.9 975.3,634.5 975.3,592.2 1024.2,554.7" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="653.3,627.5 619.1,653.8 619.1,650.3 653.3,624.0" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="721.8,650.8 886.3,715.2 852.0,741.5 687.6,677.1" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="852.0,745.0 687.6,680.6 687.6,677.1 852.0,741.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="886.3,718.7 852.0,745.0 852.0,741.5 886.3,715.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><text x="399.7" y="296.6" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">S5 · lichte 0,6 × 1,5 m</text><text x="691.4" y="445.8" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">S17 · ca. 7 × 1 m · beschädigt</text><text x="931.3" y="539.6" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">S17 Unterteil · 3,5 × 0,6 m erhalten</text><text x="321.0" y="506.8" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Gihon-Zuleitung · andere Anlage</text><text x="554.0" y="598.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Drainage · diese Karte</text><text x="786.9" y="689.1" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Jechezkel 47 · andere Ebene</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Die drei oberen Körper sind abschnittsgebundene Querschnitts- oder Erhaltungsregister in eigenen Skalen.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· S17 liefert keinen ursprünglichen Gesamtquerschnitt; moderne Beschädigung und Erhaltung bleiben sichtbar offen.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gihon-Zuleitung, städtische Drainage und Jechezkel-47-Strom bilden drei getrennte Systeme.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — Meter · je Abschnitt eigener Maßstab</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· einheitlicher Gesamtquerschnitt</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gesamtverlauf und Gefälle</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· hydraulische Leistung</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gleichsetzung der Wassersysteme</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Entwässerungskanal · Abschnittsregister und Systemtrennung</text></svg>