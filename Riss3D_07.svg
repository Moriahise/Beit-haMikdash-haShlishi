<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Fünf Tore des Rambam-Referenzbergs</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 07 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25" direction="rtl">חֲמִשָּׁה שְׁעָרִים לְהַר הַבַּיִת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Fünf Tore des Rambam-Referenzbergs</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Maßstab in Ammot · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><line x1="467.4" y1="521.4" x2="364.5" y2="600.3" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="527.4" y1="544.9" x2="424.5" y2="623.8" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="587.4" y1="568.4" x2="484.6" y2="647.3" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="647.4" y1="591.8" x2="544.6" y2="670.8" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="707.4" y1="615.3" x2="604.6" y2="694.3" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="767.4" y1="638.8" x2="664.6" y2="717.7" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="827.5" y1="662.3" x2="724.6" y2="741.2" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="467.4" y1="521.4" x2="875.5" y2="681.1" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="424.5" y1="554.3" x2="832.6" y2="714.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="381.7" y1="587.2" x2="789.8" y2="746.8" stroke="#B8925D" stroke-width=".5" opacity=".22"/><polygon points="467.4,521.4 875.5,681.1 772.6,760.0 364.5,600.3" fill="#101515" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="562.6,610.3 682.6,657.3 677.4,661.2 557.4,614.3" fill="#F2EAD9" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="677.4,666.2 557.4,619.2 557.4,614.3 677.4,661.2" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="547.1,627.1 403.1,570.7 403.1,324.0 547.1,380.4" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="682.6,662.2 677.4,666.2 677.4,661.2 682.6,657.3" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="572.8,607.4 547.1,627.1 547.1,380.4 572.8,360.6" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="772.6,767.4 364.5,607.7 364.5,600.3 772.6,760.0" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="428.8,304.3 572.8,360.6 547.1,380.4 403.1,324.0" fill="#B8925D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="875.5,688.5 772.6,767.4 772.6,760.0 875.5,681.1" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="811.2,730.4 667.2,674.0 667.2,427.3 811.2,483.7" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="572.8,336.0 692.9,382.9 667.2,402.6 547.1,355.7" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="667.2,427.3 547.1,380.4 547.1,355.7 667.2,402.6" fill="#B8925D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="836.9,710.7 811.2,730.4 811.2,483.7 836.9,463.9" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="692.9,407.6 667.2,427.3 667.2,402.6 692.9,382.9" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="692.9,407.6 836.9,463.9 811.2,483.7 667.2,427.3" fill="#B8925D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><text x="620.0" y="353.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Sturz</text><text x="620.0" y="517.3" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">lichte Öffnung 10 × 20</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Sturz belegt; die Ausnahme des Tadi-Tors bleibt hier ungezeichnet.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerhöhe über dem Sturz nicht überliefert; Tiefe des Durchgangs nicht angegeben.</text><line x1="46" y1="756" x2="110.44544426335175" y2="756" stroke="#D7BD87" stroke-width="3"/><text x="120.4" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">5 Ammot (in der Bodenebene)</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Türflügel (vorhanden; Zahl und Maße offen)</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Sturz / Tadi-Ausnahme (zwei geneigte Steine; kein Maß)</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerstärke / Durchgangstiefe</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Lage der Tore an den Seiten</text><text x="645.0" y="942.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerstärke und Durchgangstiefe</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Axonometrie · relative Lage · keine Perspektive, kein Bildwerk · kein Zukunftsbauplan</text></svg>