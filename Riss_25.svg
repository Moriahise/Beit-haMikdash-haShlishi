<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1010" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Wasserorte · Texttopographie — Gihon und Schiloach — die historische Wasserachse</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1010.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 25 · Wasserorte · Texttopographie</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">מַעְיַן הַגִּיחוֹן וְשִׁלֹּחַ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Gihon und Schiloach — die historische Wasserachse</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Keine Maßzahl · nur Ort, Zeit und relative Richtung</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="175.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1.2">TEXTTOPOGRAPHIE · DREI ZEITSCHICHTEN</text><line x1="80.0" y1="212.0" x2="1160.0" y2="212.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 7"/><line x1="80.0" y1="432.0" x2="1160.0" y2="432.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 7"/><line x1="80.0" y1="652.0" x2="1160.0" y2="652.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 7"/><text x="85.0" y="230.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">DAVID / SCHLOMO · ORTSBELEG</text><rect x="250.0" y="260.0" width="260.0" height="78.0" fill="#101515" stroke="#9EC2C7" stroke-width="2" rx="8"/><text x="380.0" y="291.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">גִּיחוֹן</text><text x="380.0" y="315.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Gihon · Ort belegt</text><text x="560.0" y="305.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11">keine Gestalt · kein Maß</text><text x="85.0" y="450.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">ACHAZ · JESC 8:6</text><rect x="250.0" y="480.0" width="300.0" height="78.0" fill="#101515" stroke="#9EC2C7" stroke-width="2" rx="8"/><text x="400.0" y="511.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">מֵי הַשִּׁלֹחַ</text><text x="400.0" y="535.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Schiloach · langsam gehende Wasser</text><text x="600.0" y="524.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11">nicht mit Chiskijahus Werk gleichgesetzt</text><text x="85.0" y="670.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">CHISKIJAHU / NECHEMJA · GETRENNTE TEXTE</text><rect x="190.0" y="700.0" width="220.0" height="78.0" fill="#101515" stroke="#9EC2C7" stroke-width="2" rx="8"/><text x="300.0" y="731.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">גִּיחוֹן</text><text x="300.0" y="755.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Quellort</text><rect x="510.0" y="700.0" width="260.0" height="78.0" fill="#101515" stroke="#CFB36D" stroke-width="2" rx="8"/><text x="640.0" y="731.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">לְמַטָּה מַּעְרָבָה</text><text x="640.0" y="755.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">abwärts / westwärts</text><rect x="870.0" y="700.0" width="260.0" height="78.0" fill="#101515" stroke="#9EC2C7" stroke-width="2" rx="8"/><text x="1000.0" y="731.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="16" text-anchor="middle">בְּרֵכַת הַשֶּׁלַח</text><text x="1000.0" y="755.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">beim Königsgarten</text><line x1="410.0" y1="739.0" x2="500.0" y2="739.0" stroke="#9EC2C7" stroke-width="2" stroke-dasharray="6 5"/><path d="M500 739 l-12 -6 l3 12 z" fill="#9EC2C7"/><line x1="770.0" y1="739.0" x2="860.0" y2="739.0" stroke="#9EC2C7" stroke-width="2" stroke-dasharray="6 5"/><path d="M860 739 l-12 -6 l3 12 z" fill="#9EC2C7"/><text x="870.0" y="805.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10">Stufen von der Davidstadt: vorhanden · Anzahl offen</text><text x="190.0" y="836.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11">Die Pfeile zeigen nur die belegte relative Richtung, keinen identifizierten Leitungsverlauf.</text><line x1="46.0" y1="876.0" x2="1194.0" y2="876.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="884.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="892.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Wasserort — im jeweiligen Text belegt</text><rect x="46.0" y="902.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Richtung — abwärts / westwärts</text><rect x="46.0" y="920.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="928.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Trennlinie — Zeitschichten nicht verschmolzen</text><text x="645.0" y="890.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="908.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· bauliche Maßzahlen</text><text x="645.0" y="924.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· identischer Verlauf aller Wassertexte</text><text x="645.0" y="940.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· moderne Identifikation</text><text x="645.0" y="956.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Zukunftsstrom aus Jechezkel 47</text><text x="620.0" y="988.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Texttopographie · Zeitschichten getrennt · kein Leitungsplan</text></svg>