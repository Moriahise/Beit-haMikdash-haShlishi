<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Hofpflaster, Festigkeit und Verschönerung</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 40 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">רִצְפַּת הָעֲזָרָה וּפְאֵר הַבַּיִת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Hofpflaster, Festigkeit und Verschönerung</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Pflaster- und Hiddur-Schema · ohne Maßstab · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polyline points="859.6,459.1 603.3,655.9 603.3,638.1" fill="none" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 6"/><text x="603.3" y="671.9" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Normstufe getrennt</text><polygon points="426.3,285.8 834.8,445.6 613.9,615.2 205.4,455.4" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="499.7,387.6 592.6,423.9 526.3,474.8 433.4,438.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="592.6,437.9 526.3,488.8 526.3,474.8 592.6,423.9" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="526.3,488.8 433.4,452.5 433.4,438.5 526.3,474.8" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="890.5,468.1 1051.4,531.0 1011.7,561.5 850.7,498.6" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="1011.7,564.7 850.7,501.8 850.7,498.6 1011.7,561.5" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="834.8,449.4 613.9,619.0 613.9,615.2 834.8,445.6" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="613.9,619.0 205.4,459.2 205.4,455.4 613.9,615.2" fill="#B8925D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="1051.4,534.2 1011.7,564.7 1011.7,561.5 1051.4,531.0" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="833.1,510.6 994.0,573.5 954.2,604.0 793.3,541.1" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="954.2,608.8 793.3,545.9 793.3,541.1 954.2,604.0" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="994.0,578.3 954.2,608.8 954.2,604.0 994.0,573.5" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="775.6,553.1 936.5,616.0 896.8,646.6 735.8,583.6" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="896.8,652.9 735.8,590.0 735.8,583.6 896.8,646.6" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="936.5,622.4 896.8,652.9 896.8,646.6 936.5,616.0" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="718.2,595.6 879.1,658.5 839.3,689.1 678.4,626.1" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="839.3,697.0 678.4,634.1 678.4,626.1 839.3,689.1" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="879.1,666.5 839.3,697.0 839.3,689.1 879.1,658.5" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><text x="520.1" y="444.1" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Ritzpah · gepflasterte Fläche</text><text x="513.0" y="424.8" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">angehobener Stein · Prüfung</text><text x="951.1" y="508.4" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Material</text><text x="893.6" y="550.9" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Bearbeitung</text><text x="836.2" y="593.4" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Ordnung</text><text x="778.8" y="636.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Schönheit / Hiddur</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Die Pflasterfläche bleibt ungerastert, weil Plattenmaß und Verband fehlen.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Der angehobene Stein zeigt nur den beschriebenen Prüfvorgang.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Vier Hiddur-Stufen sind eine Begriffsordnung, keine Höhenstaffel.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — Pflaster- und Hiddur-Schema · ohne Maßstab</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Plattenformat und Fugenraster</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gesamtfläche und Dicke</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Unterbau</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· numerische Hiddur-Stufen</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Ritzpah und Hiddur · Fläche plus Qualitätsordnung</text></svg>