<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Streckenschema — Die Aufstiegsstraße vom Schiloach zum Tempelberg</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="900.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 31 · Streckenschema</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25" direction="rtl">דֶּרֶךְ הָעוֹלִים מִן הַשִּׁלֹחַ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die Aufstiegsstraße vom Schiloach zum Tempelberg</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Archäologischer Befund in Metern · Längs- und Querachse mit eigenen Maßstäben</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><rect x="318.0" y="220.0" width="24.0" height="480.0" fill="#101515" stroke="url(#rWall)" stroke-width="3"/><rect x="285.0" y="610.0" width="90.0" height="90.0" fill="none" stroke="#D7BD87" stroke-width="2" stroke-dasharray="6 5"/><line x1="285.0" y1="744.0" x2="375.0" y2="744.0" stroke="#D7BD87" stroke-width="1"/><line x1="285.0" y1="740.0" x2="285.0" y2="748.0" stroke="#D7BD87" stroke-width="1"/><line x1="375.0" y1="740.0" x2="375.0" y2="748.0" stroke="#D7BD87" stroke-width="1"/><text x="330.0" y="737.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">bis 30 m · Aufweitung</text><text x="391.0" y="655.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10">Länge dieses Abschnitts nicht angegeben</text><line x1="225.0" y1="220.0" x2="225.0" y2="700.0" stroke="#F2EAD9" stroke-width="1"/><line x1="221.0" y1="220.0" x2="229.0" y2="220.0" stroke="#F2EAD9" stroke-width="1"/><line x1="221.0" y1="700.0" x2="229.0" y2="700.0" stroke="#F2EAD9" stroke-width="1"/><text x="217.0" y="460.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle" transform="rotate(-90 217.0 460.0)">ca. 600 m · Süd → Nord</text><line x1="318.0" y1="196.0" x2="342.0" y2="196.0" stroke="#D7BD87" stroke-width="1"/><line x1="318.0" y1="192.0" x2="318.0" y2="200.0" stroke="#D7BD87" stroke-width="1"/><line x1="342.0" y1="192.0" x2="342.0" y2="200.0" stroke="#D7BD87" stroke-width="1"/><text x="330.0" y="189.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">8 m Regelbreite</text><text x="330.0" y="168.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Nord · Fuß des Tempelbergs</text><text x="330.0" y="776.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Süd · Bereich des Schiloach-Beckens</text><line x1="368.0" y1="260.0" x2="368.0" y2="680.0" stroke="#6E9EAA" stroke-width="3" stroke-dasharray="9 8"/><text x="382.0" y="460.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11">getrennter Entwässerungskanal</text><text x="382.0" y="476.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">eigenes System · keine Gleichsetzung</text><rect x="770.0" y="250.0" width="330.0" height="120.0" fill="url(#rHatch)" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5"/><text x="935.0" y="300.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="14" text-anchor="middle">Höhenprofil</text><text x="935.0" y="322.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="14" text-anchor="middle">nicht angegeben</text><text x="770.0" y="396.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Keine Gesamtsteigung, keine Stufenzahl.</text><rect x="770.0" y="470.0" width="330.0" height="110.0" fill="#0B0E0E" stroke="#CFB36D" stroke-width="1.5" stroke-dasharray="5 4"/><text x="790.0" y="500.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="11">Schicht B · Rambam, Beit HaBechirah 5:2</text><text x="790.0" y="524.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12">Tempelberg-Toröffnung: 10 breit × 20 hoch Ammot</text><text x="790.0" y="548.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10">In Ammot — nicht in diese Meterzeichnung gesetzt.</text><path d="M1148 284V240 M1148 240l-7 12 M1148 240l7 12" fill="none" stroke="#D7BD87" stroke-width="2"/><text x="1148.0" y="300.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">NORD</text><text x="1148.0" y="316.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Norden oben</text><rect x="700.0" y="640.0" width="160.0" height="9.0" fill="none" stroke="#B8925D" stroke-width="1"/><rect x="700.0" y="640.0" width="40.0" height="9.0" fill="#B8925D" opacity=".65"/><rect x="780.0" y="640.0" width="80.0" height="9.0" fill="#B8925D" opacity=".65"/><text x="700.0" y="634.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">0</text><text x="740.0" y="634.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">5</text><text x="780.0" y="634.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">10</text><text x="860.0" y="634.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">20</text><text x="872.0" y="649.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">je 10 m</text><line x1="46.0" y1="766.0" x2="1194.0" y2="766.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="774.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="782.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">durchgezogen — Maß im Grabungsbefund belegt</text><rect x="46.0" y="792.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="800.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">schraffiert — in der Karte ausdrücklich offen</text><rect x="46.0" y="810.0" width="16.0" height="9.0" fill="#6E9EAA" opacity=".85"/><text x="70.0" y="818.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">blau — Wassersystem · eigene Ebene</text><text x="645.0" y="780.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="798.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Pflasterkörper (nicht einheitlich angegeben)</text><text x="645.0" y="814.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhenanstieg</text><text x="645.0" y="830.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Krümmung und genauer Verlauf</text><text x="645.0" y="846.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Lage eines künftigen Zieltors</text><text x="620.0" y="878.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Streckenschema · relative Lage · historischer Befund · kein Zukunftsbauplan</text></svg>