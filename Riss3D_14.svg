<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — </title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 14 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25" direction="rtl">הָאוּלָם</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic"></text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Maßstab in Ammot · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><line x1="659.0" y1="396.7" x2="319.2" y2="657.6" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="897.0" y1="489.9" x2="557.2" y2="750.7" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="659.0" y1="396.7" x2="920.8" y2="499.2" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="489.1" y1="527.2" x2="750.9" y2="629.6" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="319.2" y1="657.6" x2="581.0" y2="760.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><polygon points="886.8,525.2 625.0,422.8 625.0,276.1 886.8,378.5" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="659.0,250.0 920.8,352.4 886.8,378.5 625.0,276.1" fill="#B8925D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="920.8,499.2 886.8,525.2 886.8,378.5 920.8,352.4" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="672.6,441.5 400.8,650.1 400.8,503.4 672.6,294.7" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="659.0,396.7 920.8,499.2 581.0,760.0 319.2,657.6" fill="#101515" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="625.0,276.1 672.6,294.7 400.8,503.4 353.2,484.8" fill="#B8925D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="920.8,518.7 581.0,779.6 581.0,760.0 920.8,499.2" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="886.8,525.2 615.0,733.9 615.0,587.2 886.8,378.5" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="400.8,650.1 353.2,631.5 353.2,484.8 400.8,503.4" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="839.2,359.9 886.8,378.5 615.0,587.2 567.4,568.5" fill="#B8925D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="581.0,779.6 319.2,677.1 319.2,657.6 581.0,760.0" fill="#0B0E0E" fill-opacity="1" stroke="#B8925D" stroke-width="1" stroke-opacity=".85"/><polygon points="581.0,760.0 319.2,657.6 319.2,510.8 581.0,613.3" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="615.0,733.9 567.4,715.3 567.4,568.5 615.0,587.2" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><polygon points="353.2,484.8 615.0,587.2 581.0,613.3 319.2,510.8" fill="#B8925D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="615.0,733.9 581.0,760.0 581.0,613.3 615.0,587.2" fill="#8F653D" fill-opacity="0.82" stroke="#D7BD87" stroke-width="1" stroke-opacity=".85"/><text x="891.8" y="369.7" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">NORD</text><text x="893.7" y="685.4" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">OST</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerhöhe nicht überliefert — die Mauern stehen nur als Andeutung.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerstärke nicht überliefert — hier als schmales Band gezeigt.</text><line x1="46" y1="756" x2="301.54257283865746" y2="756" stroke="#D7BD87" stroke-width="3"/><text x="311.5" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">10 Ammot (in der Bodenebene)</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Ulam · Baukörperhöhe</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Axonometrie · relative Lage · keine Perspektive, kein Bildwerk · kein Zukunftsbauplan</text></svg>