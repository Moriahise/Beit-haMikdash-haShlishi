<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 970" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Kodesch HaKodaschim · Raum und Zugang — Kodesch HaKodaschim — 20 auf 20</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="970.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 16 · Kodesch HaKodaschim · Raum und Zugang</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">קֹדֶשׁ הַקֳּדָשִׁים — 20 × 20</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Kodesch HaKodaschim — 20 auf 20</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Raum 20 × 20 · lichte Weite 7 · Zahl 6 achsenstrittig</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="100.0" y="175.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1.1">A-GRUNDRISS · 20 × 20 AMOT</text><rect 