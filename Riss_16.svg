ill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">nicht als zusätzliche Länge an den A-Raum angehängt</text><line x1="46.0" y1="836.0" x2="1194.0" y2="836.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="844.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="852.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">A-Raum — Jechezkel 20 × 20</text><rect x="46.0" y="862.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="870.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">alternative Lesung — 6 als Türbreite</text><rect x="46.0" y="880.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="888.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offen — Raumhöhe und Harmonisierung</text><text x="645.0" y="850.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="868.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Raumhöhe</text><text x="645.0" y="884.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Harmonisierung von 6 und 7</text><text x="645.0" y="900.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Übertragung fremder Bauhöhen</text><text x="645.0" y="916.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Addition der B-20 zur A-Länge</text><text x="620.0" y="948.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Debir · Grundrissanker, Zugang und B-Ausführung getrennt</text></svg>