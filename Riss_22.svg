 font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Tur saviv · Form offen</text><rect x="548.0" y="503.0" width="180.0" height="135.0" fill="#101515" stroke="#9EC2C7" stroke-width="2"/><rect x="558.0" y="513.0" width="160.0" height="115.0" fill="none" stroke="#6E9EAA" stroke-width="1" stroke-dasharray="4 4"/><text x="638.0" y="559.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">ECKHOF 4</text><text x="638.0" y="585.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">40 × 30 · Einheit offen</text><text x="638.0" y="608.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="9" text-anchor="middle">Tur saviv · Form offen</text><text x="430.0" y="440.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Bezirk nur schematisch</text><text x="430.0" y="462.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">seine Maße sind auf dieser Karte nicht angegeben</text><text x="875.0" y="175.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1.2">B-REFERENZ · GETRENNT</text><rect x="875.0" y="270.0" width="220.0" height="220.0" fill="#101515" stroke="#CFB36D" stroke-width="2" stroke-dasharray="7 5"/><text x="985.0" y="360.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="18" text-anchor="middle">40 × 40</text><text x="985.0" y="386.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Ammot</text><text x="985.0" y="418.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Middot / Rambam</text><text x="875.0" y="542.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11">Nicht in Jechezkel 46:22 eingesetzt.</text><text x="875.0" y="568.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10">„Keine Überdachung“ ist B-Deutung von keturot,</text><text x="875.0" y="585.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10">kein A-Maß und keine gezeichnete Dachform.</text><line x1="46.0" y1="786.0" x2="1194.0" y2="786.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="794.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="802.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">vier gleiche Höfe — 40 × 30 in derselben offenen Versebene</text><rect x="46.0" y="812.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="820.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">B-Referenz — 40 × 40 Ammot, separat</text><rect x="46.0" y="830.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="838.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offen — Höhe, Wände und Öffnungen fehlen</text><text x="645.0" y="800.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="818.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Einheit der 40 × 30</text><text x="645.0" y="834.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhen und Wandstärken</text><text x="645.0" y="850.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Öffnungen</text><text x="645.0" y="866.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gleichsetzung mit 40 × 40 Ammot</text><text x="620.0" y="898.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Eckanordnung belegt · Versmaß und Referenzmaß nicht verschmolzen</text></svg>