<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Große Steine, Ziegel und Bearbeitung außerhalb</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 38 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">אֲבָנִים גְּדוֹלוֹת וְסִתּוּת מִבַּחוּץ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Große Steine, Ziegel und Bearbeitung außerhalb</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Arbeits- und Quellenfolge · ohne Maßstab · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><polygon points="354.4,295.0 502.8,353.1 410.7,423.8 262.2,365.7" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="502.8,373.0 410.7,443.7 410.7,423.8 502.8,353.1" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="410.7,443.7 262.2,385.6 262.2,365.7 410.7,423.8" fill="#B8925D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="541.6,368.2 690.0,426.3 597.9,497.1 449.4,439.0" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="690.0,446.2 597.9,517.0 597.9,497.1 690.0,426.3" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="597.9,517.0 449.4,458.9 449.4,439.0 597.9,497.1" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="324.0,453.9 524.1,532.2 487.2,560.5 287.1,482.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="487.2,564.5 287.1,486.2 287.1,482.2 487.2,560.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="728.8,441.5 877.3,499.6 785.1,570.3 636.6,512.2" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="524.1,536.2 487.2,564.5 487.2,560.5 524.1,532.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="877.3,519.5 785.1,590.2 785.1,570.3 877.3,499.6" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="785.1,590.2 636.6,532.1 636.6,512.2 785.1,570.3" fill="#6E9EAA" fill-opacity="0.34" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="916.0,514.7 1051.6,567.8 959.4,638.5 823.8,585.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="614.5,567.6 814.6,645.9 777.7,674.2 577.6,595.9" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="1051.6,587.7 959.4,658.4 959.4,638.5 1051.6,567.8" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="959.4,658.4 823.8,605.4 823.8,585.5 959.4,638.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="777.7,678.1 577.6,599.9 577.6,595.9 777.7,674.2" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="814.6,649.8 777.7,678.1 777.7,674.2 814.6,645.9" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><text x="382.5" y="352.8" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">große Steine · außen bearbeiten</text><text x="569.7" y="426.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">transportieren</text><text x="756.9" y="499.3" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">einsetzen · innen kein Eisen</text><text x="937.7" y="570.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Verband offen</text><text x="405.6" y="500.6" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">alternative Auslegung</text><text x="696.1" y="614.2" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">nicht behauptete Rekonstruktion</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Dargestellt ist eine Arbeitsfolge, kein Mauerverband.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Bearbeitung außerhalb und Eisenverbot innerhalb bleiben logisch getrennt.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Alternative Lesarten werden nicht in den Hauptablauf gemischt.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — Arbeits- und Quellenfolge · ohne Maßstab</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Steinmaße und Stückzahl</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerverband</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Werkzeugform</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Transporttechnik</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Große Steine · Bearbeitungsordnung und offener Verband</text></svg>