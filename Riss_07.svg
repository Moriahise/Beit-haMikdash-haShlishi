<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Torschema — Fünf Tore des Rambam-Referenzbergs</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="900.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 07 · Torschema</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25" direction="rtl">חֲמִשָּׁה שְׁעָרִים לְהַר הַבַּיִת</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Fünf Tore des Rambam-Referenzbergs</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Öffnung maßstäblich in Ammot · Verteilung schematisch</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="150.0" y="220.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13">Lichte Öffnung · maßstäblich</text><text x="150.0" y="240.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">Rambam BhB 5 [ב]; vgl. Middot 2:3</text><rect x="120.0" y="320.0" width="190.0" height="300.0" fill="#101515" stroke="url(#rWall)" stroke-width="4"/><rect x="150.0" y="360.0" width="130.0" height="260.0" fill="#0B0E0E" stroke="#F2EAD9" stroke-width="2"/><line x1="90.0" y1="620.0" x2="370.0" y2="620.0" stroke="#B8925D" stroke-width="2"/><line x1="150.0" y1="306.0" x2="280.0" y2="306.0" stroke="#F2EAD9" stroke-width="1"/><line x1="150.0" y1="302.0" x2="150.0" y2="310.0" stroke="#F2EAD9" stroke-width="1"/><line x1="280.0" y1="302.0" x2="280.0" y2="310.0" stroke="#F2EAD9" stroke-width="1"/><text x="215.0" y="299.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">10 Ammot breit</text><line x1="104.0" y1="360.0" x2="104.0" y2="620.0" stroke="#F2EAD9" stroke-width="1"/><line x1="100.0" y1="360.0" x2="108.0" y2="360.0" stroke="#F2EAD9" stroke-width="1"/><line x1="100.0" y1="620.0" x2="108.0" y2="620.0" stroke="#F2EAD9" stroke-width="1"/><text x="96.0" y="490.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle" transform="rotate(-90 96.0 490.0)">20 Ammot hoch</text><text x="150.0" y="644.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Türflügel belegt · Zahl und Maße nicht angegeben</text><text x="700.0" y="260.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13">Verteilung der 5 Tore</text><text x="700.0" y="278.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">Bezugsfläche schematisch — ihr Maß steht auf einer eigenen Karte</text><rect x="700.0" y="300.0" width="380.0" height="380.0" fill="#101515" stroke="#B8925D" stroke-width="2" stroke-dasharray="7 6"/><text x="648.0" y="494.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">W · 1 Tor</text><rect x="696.0" y="474.0" width="8.0" height="32.0" fill="#0B0E0E" stroke="#D7BD87" 