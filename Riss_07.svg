nden; Zahl und Maße offen)</text><text x="645.0" y="814.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Sturz / Tadi-Ausnahme (zwei geneigte Steine; kein Maß)</text><text x="645.0" y="830.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerstärke / Durchgangstiefe</text><text x="645.0" y="846.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Abstände der Tore zueinander</text><text x="645.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerstärke und Durchgangstiefe</text><text x="620.0" y="878.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Torschema · Öffnung maßstäblich · Lage nicht behauptet</text></svg>