<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Trennzonenvergleich — Die Trennzone Heichal–Kodesch: eine oder zwei Amot</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="860.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 17 · Trennzonenvergleich</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">אַמַּת טְרַקְסִין — אַחַת אוֹ שְׁתַּיִם</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die Trennzone Heichal–Kodesch: eine oder zwei Amot</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Breitenmaß in Ammot · drei Bauzustände getrennt</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><rect x="105.0" y="190.0" width="290.0" height="390.0" fill="#0B0E0E" stroke="#B8925D" stroke-width="1" rx="10"/><text x="250.0" y="222.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle" letter-spacing="1.4">ERSTER TEMPEL</text><text x="250.0" y="242.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Wand</text><rect x="214.0" y="250.0" width="72.0" height="270.0" fill="url(#rHatch)" stroke="#D7BD87" stroke-width="2" stroke-dasharray="6 5"/><text x="250.0" y="385.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="15" text-anchor="middle">1 Ammah</text><line x1="214.0" y1="556.0" x2="286.0" y2="556.0" stroke="#F2EAD9" stroke-width="1"/><line x1="214.0" y1="552.0" x2="214.0" y2="560.0" stroke="#F2EAD9" stroke-width="1"/><line x1="286.0" y1="552.0" x2="286.0" y2="560.0" stroke="#F2EAD9" stroke-width="1"/><text x="250.0" y="549.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">1 Ammah · O–W</text><text x="130.0" y="385.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 130.0 385.0)">N–S-Ausdehnung offen</text><rect x="455.0" y="190.0" width="290.0" height="390.0" fill="#0B0E0E" stroke="#B8925D" stroke-width="1" rx="10"/><text x="600.0" y="222.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle" letter-spacing="1.4">ZWEITER TEMPEL</text><text x="600.0" y="242.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">freier Zwischenraum · zwei Vorhänge</text><rect x="564.0" y="250.0" width="72.0" height="270.0" fill="url(#rHatchQ)" stroke="#9EC2C7" stroke-width="2" stroke-dasharray="6 5"/><line x1="569.0" y1="250.0" x2="569.0" y2="520.0" stroke="#F2EAD9" stroke-width="3" stroke-dasharray="8 5"/><line x1="631.0" y1="250.0" x2="631.0" y2="520.0" stroke="#F2EAD9" stroke-width="3" stroke-dasharray="8 5"/><text x="600.0" y="385.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">freier Raum</text><line x1="564.0" y1="556.0" x2="636.0" y2="556.0" stroke="#F2EAD9" stroke-width="1"/><line x1="564.0" y1="552.0" x2="564.0" y2="560.0" stroke="#F2EAD9" stroke-width="1"/><line x1="636.0" y1="552.0" x2="636.0" y2="560.0" stroke="#F2EAD9" stroke-width="1"/><text x="600.0" y="549.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">1 Ammah · O–W</text><text x="480.0" y="385.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 480.0 385.0)">N–S-Ausdehnung offen</text><rect x="805.0" y="190.0" width="290.0" height="390.0" fill="#0B0E0E" stroke="#B8925D" stroke-width="1" rx="10"/><text x="950.0" y="222.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle" letter-spacing="1.4">ZUKUNFTSTEXT</text><text x="950.0" y="242.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Trennelement</text><rect x="878.0" y="250.0" width="144.0" height="270.0" fill="url(#rHatch)" stroke="#9EC2C7" stroke-width="2" stroke-dasharray="6 5"/><text x="950.0" y="385.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="15" text-anchor="middle">2 Amot</text><line x1="878.0" y1="556.0" x2="1022.0" y2="556.0" stroke="#F2EAD9" stroke-width="1"/><line x1="878.0" y1="552.0" x2="878.0" y2="560.0" stroke="#F2EAD9" stroke-width="1"/><line x1="1022.0" y1="552.0" x2="1022.0" y2="560.0" stroke="#F2EAD9" stroke-width="1"/><text x="950.0" y="549.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">2 Amot · O–W</text><text x="830.0" y="385.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 830.0 385.0)">N–S-Ausdehnung offen</text><text x="620.0" y="640.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">Drei Quellenzustände · nebeneinander, nicht zu einem Bauteil verschmolzen</text><text x="620.0" y="664.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Die Breiten 1 · 1 · 2 sind maßstäblich; die gezeichnete Nord–Süd-Länge ist nur eine offene Andeutung.</text><line x1="46.0" y1="726.0" x2="1194.0" y2="726.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="734.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="742.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Wand — Erster Tempel · 1 Ammah</text><rect x="46.0" y="752.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="760.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Zwischenzone — Zweiter Tempel · 1 Ammah</text><rect x="46.0" y="770.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="778.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">offene Ausdehnung — Höhe und N–S nicht beziffert</text><text x="645.0" y="740.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="758.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhe der Trennelemente</text><text x="645.0" y="774.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Nord–Süd-Ausdehnung</text><text x="645.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Zuordnung der Zwischenzone zu innen oder außen</text><text x="645.0" y="806.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Lage eines einzelnen Vorhangs im Ersten Tempel</text><text x="620.0" y="838.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Quellenvergleich · gemeinsame O–W-Skala · keine Harmonisierung der drei Bauzustände</text></svg>