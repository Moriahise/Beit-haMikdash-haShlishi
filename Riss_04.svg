<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Visionsbezirk · drei Maßebenen — 500 Messruten — der äußere Bezirk der Vision</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="940.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 04 · Visionsbezirk · drei Maßebenen</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">חֲמֵשׁ מֵאוֹת קָנִים</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">500 Messruten — der äußere Bezirk der Vision</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">500 Kanim · 500 × 500 ohne wiederholte Einheit · B: 3000 Ammot</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="70.0" y="211.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" letter-spacing="1">42:16–19 · VIER SEITEN</text><rect x="70.0" y="245.0" width="300.0" height="300.0" fill="#101515" stroke="#D7BD87" stroke-width="2.5"/><text x="220.0" y="388.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="17" text-anchor="middle">500 × 500 Kanim</text><text x="220.0" y="413.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Einheit aus den Seitenversen</text><text x="220.0" y="228.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">500 Kanim</text><text x="52.0" y="395.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 52.0 395.0)">500 Kanim</text><text x="220.0" y="575.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Mauer umlaufend · Höhe und Dicke offen</text><text x="470.0" y="211.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="12" letter-spacing="1">42:20 · GESAMTZAHL</text><rect x="470.0" y="245.0" width="300.0" height="300.0" fill="#101515" stroke="#9EC2C7" stroke-width="2.5" stroke-dasharray="7 6"/><text x="620.0" y="388.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="17" text-anchor="middle">500 × 500</text><text x="620.0" y="413.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Einheitswort im Vers nicht wiederholt</text><rect x="485.0" y="260.0" width="270.0" height="270.0" fill="url(#rHatchQ)" stroke="none" stroke-width="1" opacity=".35"/><text x="870.0" y="211.0" fill="#CFB36D" font-family="EB Garamond, Georgia, serif" font-size="12" letter-spacing="1">B-RECHNUNG</text><rect x="870.0" y="245.0" width="300.0" height="300.0" fill="#101515" stroke="#CFB36D" stroke-width="2.5" stroke-dasharray="6 5"/><text x="1020.0" y="388.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="17" text-anchor="middle">3000 × 3000 Ammot</text><text x="1020.0" y="413.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">500 Kanim × 6 Ammot je Kaneh</text><text x="620.0" y="640.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle" letter-spacing="1.2">QUELLENLOGIK</text><line x1="220.0" y1="680.0" x2="470.0" y2="680.0" stroke="#D7BD87" stroke-width="2"/><text x="345.0" y="670.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Seitenverse geben Kanim</text><line x1="770.0" y1="680.0" x2="870.0" y2="680.0" stroke="#CFB36D" stroke-width="2" stroke-dasharray="6 5"/><text x="820.0" y="670.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">nur mit 40:5 umgerechnet</text><text x="620.0" y="735.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Die drei Quadrate stehen absichtlich in getrennten Bildschirmmaßstäben.</text><line x1="46.0" y1="806.0" x2="1194.0" y2="806.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="814.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="822.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">A-Seitenwerte — je 500 Kanim</text><rect x="46.0" y="832.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="840.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">A-Gesamtzahl — Einheit in 42:20 nicht wiederholt</text><rect x="46.0" y="850.0" width="16.0" height="9.0" fill="#CFB36D" opacity=".85"/><text x="70.0" y="858.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">B-Rechnung — Kaneh = 6 Ammot eingesetzt</text><text x="645.0" y="820.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="838.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Mauerhöhe und -dicke</text><text x="645.0" y="854.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gleichsetzung ohne 40:5</text><text x="645.0" y="870.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Umrechnung in Meter</text><text x="645.0" y="886.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Bebauung innerhalb des Bezirks</text><text x="620.0" y="918.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Quellenvergleich · Quadrate nicht optisch maßstabsgleich gesetzt</text></svg>