<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Räumlicher Riss — Die Aufstiegsstraße vom Schiloach zum Tempelberg</title><desc id="riss-d">Räumliche Darstellung ausschließlich nach den Maßangaben der Baukarte. Fehlende Höhen bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="980.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 31 · Räumlicher Riss</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25" direction="rtl">דֶּרֶךְ הָעוֹלִים מִן הַשִּׁלֹחַ</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Die Aufstiegsstraße vom Schiloach zum Tempelberg</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Axonometrie · Maßstab in Meter · keine Perspektive</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><line x1="856.7" y1="250.7" x2="257.4" y2="710.7" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="926.6" y1="278.1" x2="327.4" y2="738.1" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="856.7" y1="250.7" x2="982.6" y2="300.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="806.7" y1="289.1" x2="932.7" y2="338.3" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="756.8" y1="327.4" x2="882.7" y2="376.7" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="706.9" y1="365.7" x2="832.8" y2="415.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="656.9" y1="404.1" x2="782.8" y2="453.3" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="607.0" y1="442.4" x2="732.9" y2="491.7" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="557.0" y1="480.7" x2="683.0" y2="530.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="507.1" y1="519.1" x2="633.0" y2="568.3" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="457.2" y1="557.4" x2="583.1" y2="606.7" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="407.2" y1="595.7" x2="533.1" y2="645.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="357.3" y1="634.1" x2="483.2" y2="683.3" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="307.3" y1="672.4" x2="433.3" y2="721.7" stroke="#B8925D" stroke-width=".5" opacity=".22"/><line x1="257.4" y1="710.7" x2="383.3" y2="760.0" stroke="#B8925D" stroke-width=".5" opacity=".22"/><polygon points="898.6,266.6 940.6,283.0 880.7,329.0 838.7,312.6" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="940.6,283.6 880.7,329.6 880.7,329.0 940.6,283.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="880.7,329.6 838.7,313.1 838.7,312.6 880.7,329.0" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="914.0,272.4 925.2,276.8 326.0,736.8 314.8,732.5" fill="#D7BD87" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="925.2,277.5 326.0,737.6 326.0,736.8 925.2,276.8" fill="#8F653D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><polygon points="909.5,294.5 911.1,295.2 351.8,724.5 350.1,723.9" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="911.1,295.7 351.8,725.1 351.8,724.5 911.1,295.2" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="351.8,725.1 350.1,724.4 350.1,723.9 351.8,724.5" fill="#6E9EAA" fill-opacity="0.75" stroke="#9EC2C7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".85"/><polygon points="326.0,737.6 314.8,733.2 314.8,732.5 326.0,736.8" fill="#B8925D" fill-opacity="1" stroke="#F2EAD9" stroke-width="1" stroke-opacity=".85"/><text x="620.0" y="503.2" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">8 m breit · 600 m lang</text><text x="889.7" y="296.3" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Aufweitung bis 30 m</text><text x="630.6" y="508.1" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Entwässerung · eigenes System</text><text x="1015.5" y="201.7" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">NORD</text><text x="698.1" y="535.9" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="11" text-anchor="middle">OST</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhenprofil nicht angegeben — die Straße liegt hier waagrecht, nicht als Steigung.</text><line x1="46" y1="756" x2="121.11432235804736" y2="756" stroke="#D7BD87" stroke-width="3"/><text x="131.1" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">50 Meter (in der Bodenebene)</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Pflasterkörper (nicht einheitlich angegeben)</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Höhenanstieg</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Steigung und Stufen</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Krümmung und genauer Verlauf</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Axonometrie · relative Lage · keine Perspektive, kein Bildwerk · kein Zukunftsbauplan</text></svg>