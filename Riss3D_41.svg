idth="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="487.6,580.7 224.3,477.7 224.3,391.6 487.6,494.6" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="745.6,487.4 984.9,581.0 916.6,633.5 677.3,539.9" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="916.6,639.6 677.3,546.0 677.3,539.9 916.6,633.5" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="984.9,587.2 916.6,639.6 916.6,633.5 984.9,581.0" fill="#8F653D" fill-opacity="0.9" stroke="#8F653D" stroke-width="1" stroke-opacity=".85"/><polygon points="638.8,571.8 878.1,665.5 822.6,708.1 583.3,614.4" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="5 4" stroke-opacity=".85"/><polygon points="822.6,711.8 583.3,618.1 583.3,614.4 822.6,708.1" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><polygon points="878.1,669.1 822.6,711.8 822.6,708.1 878.1,665.5" fill="#C96B62" fill-opacity="0.13" stroke="#C96B62" stroke-width="1" stroke-dasharray="6 5" stroke-opacity=".85"/><text x="437.1" y="374.7" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Hauskörper · Maße offen</text><text x="437.1" y="374.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Innenflächen / Verkleidung</text><text x="479.4" y="321.7" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Türflügel</text><text x="555.2" y="350.2" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Fenster</text><text x="831.1" y="554.3" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">Ulam-Element · getrennt</text><text x="730.7" y="633.8" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="middle">unbelegte Details ausgeschlossen</text><text x="46.0" y="790.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Fenster, Türen und Oberflächen sind Katalogzeichen, keine positionsgenaue Fassade.</text><text x="46.0" y="807.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Der Hauskörper bleibt offen, da Maße und Öffnungsraster fehlen.</text><text x="46.0" y="824.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Das Ulam-Element wird nicht unbelegt angeschlossen.</text><text x="46.0" y="760.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="11">Ohne Maßstab — Bauteilkatalog · Maße nicht angegeben</text><line x1="46.0" y1="846.0" x2="1194.0" y2="846.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="854.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="862.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">voller Körper — Maß in der Karte belegt</text><rect x="46.0" y="872.0" width="16.0" height="9.0" fill="#B8925D" opacity=".85"/><text x="70.0" y="880.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Andeutung — Grundriss belegt, Höhe nicht überliefert</text><rect x="46.0" y="890.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="898.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">gestrichelt — in der Karte ausdrücklich offen</text><text x="645.0" y="860.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="878.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Öffnungsmaße und Anzahl</text><text x="645.0" y="894.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· genaue Lage</text><text x="645.0" y="910.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Materialdicken</text><text x="645.0" y="926.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Fassadenrekonstruktion</text><text x="620.0" y="958.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Fenster, Türen und Oberflächen · Bauteilkatalog</text></svg>