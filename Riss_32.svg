<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1100" width="100%" role="img" aria-labelledby="riss-t riss-d"><title id="riss-t">Entwässerungskanal · Abschnittsregister — Der Entwässerungskanal unter der Straße</title><desc id="riss-d">Zeichnung ausschließlich nach den Maßangaben der Baukarte. Offene Angaben bleiben offen.</desc><defs><pattern id="rHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#C96B62" stroke-width="1.5" opacity=".6"/></pattern><pattern id="rHatchQ" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#6E9EAA" stroke-width="1.2" opacity=".55"/></pattern><linearGradient id="rWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7BD87"/><stop offset="1" stop-color="#8F653D"/></linearGradient></defs><rect x="0.0" y="0.0" width="1240.0" height="1100.0" fill="#070909"/><text x="46.0" y="44.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Baukarte 32 · Entwässerungskanal · Abschnittsregister</text><line x1="46.0" y1="54.0" x2="1194.0" y2="54.0" stroke="#B8925D" stroke-width="1"/><text x="46.0" y="88.0" fill="#F2EAD9" font-family="Frank Ruhl Libre, Noto Serif Hebrew, serif" font-size="25">תְּעָלַת הַנִּקּוּז תַּחַת הָרְחוֹב</text><text x="46.0" y="112.0" fill="#D7BD87" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-style="italic">Der Entwässerungskanal unter der Straße</text><text x="1194.0" y="82.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Meter je Grabungsabschnitt · Querschnitt und Erhaltung getrennt</text><text x="1194.0" y="100.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="11" text-anchor="end">Gezeichnet wird nur, was die Karte belegt</text><text x="80.0" y="166.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="13" letter-spacing="1">DREI ABSCHNITTSBEFUNDE · KEIN EINHEITLICHER GESAMTQUERSCHNITT</text><rect x="70.0" y="205.0" width="330.0" height="360.0" fill="#101515" stroke="#B8925D" stroke-width="1.5" rx="8"/><text x="88.0" y="234.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Area S5 · lichter Querschnitt</text><text x="88.0" y="255.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">voller Abschnittswert · Deckplatten belegt</text><rect x="150.0" y="300.0" width="90.0" height="225.0" fill="url(#rHatchQ)" stroke="#9EC2C7" stroke-width="3"/><line x1="150.0" y1="278.0" x2="240.0" y2="278.0" stroke="#9EC2C7" stroke-width="1"/><line x1="150.0" y1="274.0" x2="150.0" y2="282.0" stroke="#9EC2C7" stroke-width="1"/><line x1="240.0" y1="274.0" x2="240.0" y2="282.0" stroke="#9EC2C7" stroke-width="1"/><text x="195.0" y="271.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">0.6 m</text><line x1="130.0" y1="300.0" x2="130.0" y2="525.0" stroke="#9EC2C7" stroke-width="1"/><line x1="126.0" y1="300.0" x2="134.0" y2="300.0" stroke="#9EC2C7" stroke-width="1"/><line x1="126.0" y1="525.0" x2="134.0" y2="525.0" stroke="#9EC2C7" stroke-width="1"/><text x="122.0" y="412.5" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 122.0 412.5)">1.5 m</text><line x1="135.0" y1="292.0" x2="255.0" y2="292.0" stroke="#D7BD87" stroke-width="8"/><text x="270.0" y="530.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Breite × Höhe</text><rect x="455.0" y="205.0" width="330.0" height="360.0" fill="#101515" stroke="#B8925D" stroke-width="1.5" rx="8"/><text x="473.0" y="234.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12">Area S17 · beschädigter Abschnitt</text><text x="473.0" y="255.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10">freigelegte Länge × Breite · nur untere Partien</tex