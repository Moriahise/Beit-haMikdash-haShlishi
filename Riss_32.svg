rhalten</text><line x1="867.0" y1="340.0" x2="867.0" y2="382.0" stroke="#D7BD87" stroke-width="1"/><line x1="863.0" y1="340.0" x2="871.0" y2="340.0" stroke="#D7BD87" stroke-width="1"/><line x1="863.0" y1="382.0" x2="871.0" y2="382.0" stroke="#D7BD87" stroke-width="1"/><text x="859.0" y="361.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle" transform="rotate(-90 859.0 361.0)">ca. 0.6 m</text><text x="1005.0" y="430.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Erhaltungsmaß · keine Ursprungshöhe</text><text x="80.0" y="620.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="12" letter-spacing="1.4">SYSTEMTRENNUNG</text><rect x="70.0" y="655.0" width="330.0" height="115.0" fill="url(#rHatch)" stroke="#D7BD87" stroke-width="2" rx="8"/><text x="235.0" y="690.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">Gihon → Stadt</text><text x="235.0" y="718.0" fill="#D7BD87" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Zuleitung · Erste-Tempel-Periode</text><text x="235.0" y="746.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">andere Anlage</text><rect x="455.0" y="655.0" width="330.0" height="115.0" fill="#101515" stroke="#9EC2C7" stroke-width="2" rx="8"/><text x="620.0" y="690.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">Tyropoeon-Korridor</text><text x="620.0" y="718.0" fill="#9EC2C7" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">städtische Drainage · diese Karte</text><text x="620.0" y="746.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">diese Anlage</text><rect x="840.0" y="655.0" width="330.0" height="115.0" fill="url(#rHatch)" stroke="#D7A09A" stroke-width="2" rx="8"/><text x="1005.0" y="690.0" fill="#F2EAD9" font-family="EB Garamond, Georgia, serif" font-size="13" text-anchor="middle">vom Haus ostwärts</text><text x="1005.0" y="718.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Jechezkel 47 · Zukunftsstrom</text><text x="1005.0" y="746.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">andere Ebene</text><line x1="425.0" y1="640.0" x2="425.0" y2="790.0" stroke="#C96B62" stroke-width="2" stroke-dasharray="6 6"/><line x1="810.0" y1="640.0" x2="810.0" y2="790.0" stroke="#C96B62" stroke-width="2" stroke-dasharray="6 6"/><rect x="70.0" y="820.0" width="1100.0" height="70.0" fill="#0B0E0E" stroke="#C96B62" stroke-width="1.2" stroke-dasharray="6 5"/><text x="620.0" y="850.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="12" text-anchor="middle">Gesamtverlauf · Gefälle · hydraulische Leistung: nicht angegeben</text><text x="620.0" y="876.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Abschnittsmaße schließen diese Lücken nicht.</text><line x1="46.0" y1="966.0" x2="1194.0" y2="966.0" stroke="#B8925D" stroke-width="1" stroke-dasharray="2 6"/><rect x="46.0" y="974.0" width="16.0" height="9.0" fill="#9EC2C7" opacity=".85"/><text x="70.0" y="982.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">S5 — lichter Querschnitt</text><rect x="46.0" y="992.0" width="16.0" height="9.0" fill="#C96B62" opacity=".85"/><text x="70.0" y="1000.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">S17 — beschädigter oder offener Befund</text><rect x="46.0" y="1010.0" width="16.0" height="9.0" fill="#D7BD87" opacity=".85"/><text x="70.0" y="1018.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">Trennung — Zuleitung · Drainage · Zukunftsstrom</text><text x="645.0" y="980.0" fill="#D7A09A" font-family="EB Garamond, Georgia, serif" font-size="10" letter-spacing="2">NICHT GEZEICHNET</text><text x="645.0" y="998.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· einheitlicher Gesamtquerschnitt</text><text x="645.0" y="1014.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gesamtverlauf und Gefälle</text><text x="645.0" y="1030.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· hydraulische Leistung</text><text x="645.0" y="1046.0" fill="#A89F8E" font-family="EB Garamond, Georgia, serif" font-size="11">· Gleichsetzung der drei Wassersysteme</text><text x="620.0" y="1078.0" fill="#6F746D" font-family="EB Garamond, Georgia, serif" font-size="10" text-anchor="middle">Städtische Drainage · abschnittsgebundene Grabungsmaße · keine Zukunftsnorm</text></svg>